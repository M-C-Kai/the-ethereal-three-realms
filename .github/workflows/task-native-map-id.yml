name: task-native-map-id

on:
  push:
    branches: ['fix/task-native-map-id']
    paths:
      - 'implementation_staging/server.py'
      - 'implementation_staging/tests/test_task_minimum_flow.py'
      - '.github/workflows/task-native-map-id.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native task map-id regression
        working-directory: implementation_staging
        run: python -m unittest tests.test_task_minimum_flow -v
