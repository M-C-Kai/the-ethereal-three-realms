name: temp-consignment-fix-role-items
on:
  push:
    branches: [ feat/consignment-system ]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix live role item list
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('implementation_staging/consignment_service.py')
          s = p.read_text(encoding='utf-8')
          old = """def _role_items(role: dict[str, Any]) -> list[dict[str, Any]]:\n    items = role.get('items')\n    if not isinstance(items, list):\n        items = []\n        role['items'] = items\n    return [item for item in items if isinstance(item, dict)]\n"""
          new = """def _role_items(role: dict[str, Any]) -> list[dict[str, Any]]:\n    items = role.get('items')\n    if not isinstance(items, list):\n        items = []\n        role['items'] = items\n    if any(not isinstance(item, dict) for item in items):\n        items = [item for item in items if isinstance(item, dict)]\n        role['items'] = items\n    return items\n"""
          if old not in s:
              raise SystemExit('role item helper marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/temp_consignment_fix_role_items.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add implementation_staging/consignment_service.py .github/workflows/temp_consignment_fix_role_items.yml
          git commit -m "fix: mutate live role inventory in consignment"
          git push
