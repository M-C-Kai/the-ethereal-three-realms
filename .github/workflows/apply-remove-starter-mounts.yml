name: Apply removal of starter mounts

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-remove-starter-mounts.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch mount ownership model
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('implementation_staging/item_registry.py')
          source = path.read_text(encoding='utf-8')
          anchor = "UNSUPPORTED_EQUIPMENT_FILE = (\n    Path(__file__).resolve().parent / 'data' / 'catalog' / 'unsupported_equipment_slots.json'\n)\n"
          insert = anchor + "MOUNT_APPEARANCE_MAPPING_FILE = (\n    Path(__file__).resolve().parent / 'data' / 'catalog' / 'mount_appearance_mapping.json'\n)\n"
          if 'MOUNT_APPEARANCE_MAPPING_FILE' not in source:
              if anchor not in source:
                  raise SystemExit('item registry mount path anchor not found')
              source = source.replace(anchor, insert, 1)

          function_anchor = "def deprecated_unsupported_equipment_template_ids() -> frozenset[int]:\n    \"\"\"Return old local starter/preview templates removed from saved roles.\"\"\"\n    return _unsupported_equipment_catalog()[1]\n\n\n"
          function_insert = function_anchor + "@lru_cache(maxsize=1)\ndef deprecated_mount_template_ids() -> frozenset[int]:\n    \"\"\"Return all mount templates that must not be auto-owned by roles.\"\"\"\n    data = json.loads(MOUNT_APPEARANCE_MAPPING_FILE.read_text(encoding='utf-8'))\n    image_base = int(data.get('image_base', 40000))\n    projection = data.get('item_projection', {})\n    template_base = int(projection.get('template_base', 170900000))\n    named = data.get('named_templates', {})\n    template_ids: set[int] = set()\n    for family in data.get('families', []):\n        for raw_image_id in family.get('image_ids', []):\n            image_id = int(raw_image_id)\n            ride_code = image_id - image_base\n            override = named.get(str(image_id), {})\n            template_ids.add(int(override.get('template_id', template_base + ride_code)))\n    expected = int(data.get('count', len(template_ids)))\n    if len(template_ids) != expected:\n        raise ValueError(f'mount deprecated template count mismatch: expected={expected} actual={len(template_ids)}')\n    return frozenset(template_ids)\n\n\n"
          if 'def deprecated_mount_template_ids()' not in source:
              if function_anchor not in source:
                  raise SystemExit('deprecated mount function anchor not found')
              source = source.replace(function_anchor, function_insert, 1)
          path.write_text(source, encoding='utf-8')

          path = Path('implementation_staging/server.py')
          source = path.read_text(encoding='utf-8')
          import_anchor = "    default_item_registry,\n    deprecated_armor_template_ids,\n    deprecated_unsupported_equipment_template_ids,\n"
          import_insert = "    default_item_registry,\n    deprecated_armor_template_ids,\n    deprecated_mount_template_ids,\n    deprecated_unsupported_equipment_template_ids,\n"
          if 'deprecated_mount_template_ids,' not in source:
              if import_anchor not in source:
                  raise SystemExit('server import anchor not found')
              source = source.replace(import_anchor, import_insert, 1)

          cleanup_anchor = "    deprecated_templates = (\n        deprecated_armor_template_ids()\n        | deprecated_unsupported_equipment_template_ids()\n    )\n    kept_items: list[dict[str, object]] = []\n    removed_deprecated = False\n"
          cleanup_insert = "    deprecated_mounts = deprecated_mount_template_ids()\n    deprecated_templates = (\n        deprecated_armor_template_ids()\n        | deprecated_unsupported_equipment_template_ids()\n        | deprecated_mounts\n    )\n    kept_items: list[dict[str, object]] = []\n    removed_deprecated = False\n    removed_deprecated_mount = False\n"
          if 'removed_deprecated_mount = False' not in source:
              if cleanup_anchor not in source:
                  raise SystemExit('server deprecated cleanup anchor not found')
              source = source.replace(cleanup_anchor, cleanup_insert, 1)

          filter_anchor = "        if template_id in deprecated_templates:\n            removed_deprecated = True\n            continue\n"
          filter_insert = "        if template_id in deprecated_templates:\n            removed_deprecated = True\n            if template_id in deprecated_mounts:\n                removed_deprecated_mount = True\n            continue\n"
          if 'if template_id in deprecated_mounts:' not in source:
              if filter_anchor not in source:
                  raise SystemExit('server deprecated item filter anchor not found')
              source = source.replace(filter_anchor, filter_insert, 1)

          save_anchor = "    if removed_deprecated:\n        role['items'] = kept_items\n        items = role_items(role)\n        changed = True\n"
          save_insert = "    if removed_deprecated:\n        role['items'] = kept_items\n        items = role_items(role)\n        changed = True\n    if removed_deprecated_mount and int(role.get('mount_model', 0)) != 0:\n        role['mount_model'] = 0\n        changed = True\n"
          if "if removed_deprecated_mount and int(role.get('mount_model', 0)) != 0:" not in source:
              if save_anchor not in source:
                  raise SystemExit('server cleanup save anchor not found')
              source = source.replace(save_anchor, save_insert, 1)
          path.write_text(source, encoding='utf-8')

          path = Path('implementation_staging/tools/sync_mount_catalog.py')
          source = path.read_text(encoding='utf-8')
          start = source.find("    reserved_offsets = {\n")
          end_marker = "    projected_starter['items'] = base_starter + starter_mounts\n"
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('sync starter projection block not found')
          end += len(end_marker)
          replacement = "    # Riding appearances are atlas/catalog resources, not default ownership.\n    projected_starter['items'] = base_starter\n"
          source = source[:start] + replacement + source[end:]
          source = source.replace(
              "print(f'synced {catalog[\"count\"]} mounts into items/starter projections')",
              "print(f'synced {catalog[\"count\"]} mount item definitions; starter grants=0')",
          )
          path.write_text(source, encoding='utf-8')

          path = Path('implementation_staging/tests/test_mount_catalog.py')
          source = path.read_text(encoding='utf-8')
          old = "    def test_new_role_receives_all_54_mounts(self):\n        role = default_role(Settings())\n        mount_items = []\n        for item in role['items']:\n            definition = self.registry.resolve(item)\n            if definition.get('kind') == 'mount':\n                mount_items.append(definition)\n        self.assertEqual(len(mount_items), 54)\n        self.assertEqual(len({int(item['mount_model']) for item in mount_items}), 54)\n"
          new = "    def test_new_role_receives_no_mounts_by_default(self):\n        role = default_role(Settings())\n        mount_items = []\n        for item in role['items']:\n            definition = self.registry.resolve(item)\n            if definition.get('kind') == 'mount':\n                mount_items.append(definition)\n        self.assertEqual(mount_items, [])\n        self.assertEqual(int(role.get('mount_model', 0)), 0)\n"
          if old not in source:
              raise SystemExit('mount starter test anchor not found')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Regenerate mount projections
        working-directory: implementation_staging
        run: python tools/sync_mount_catalog.py

      - name: Verify mount projection and tests
        working-directory: implementation_staging
        run: |
          python -m py_compile item_registry.py server.py mount_protocol.py tools/sync_mount_catalog.py
          python tools/sync_mount_catalog.py --check
          python -m unittest \
            tests.test_mount_catalog.MountCatalogTests.test_catalog_contains_54_unique_riding_appearances \
            tests.test_mount_catalog.MountCatalogTests.test_every_catalog_entry_has_matching_mount_item \
            tests.test_mount_catalog.MountCatalogTests.test_new_role_receives_no_mounts_by_default \
            tests.test_mount_catalog.MountCatalogTests.test_mount_atlas_entries_are_generated_from_resource_catalog \
            tests.test_mount_catalog.MountCatalogTests.test_mount_atlas_request_requires_byte_action_30 \
            tests.test_mount_catalog.MountCatalogTests.test_mount_atlas_frame_uses_protocol_1024_action_30

      - name: Commit applied fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation_staging/item_registry.py implementation_staging/server.py implementation_staging/tools/sync_mount_catalog.py implementation_staging/tests/test_mount_catalog.py implementation_staging/data/catalog/starter_inventory.json
          git rm .github/workflows/apply-remove-starter-mounts.yml
          git commit -m "fix: stop granting mount atlas entries as starter items"
          git push origin HEAD:master
