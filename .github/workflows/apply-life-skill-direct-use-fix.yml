name: Apply life skill direct-use fix

on:
  push:
    branches:
      - fix/life-skill-direct-use

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/life-skill-direct-use
          fetch-depth: 0

      - name: Apply protocol fix and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server_path = Path('implementation_staging/server.py')
          source = server_path.read_text(encoding='utf-8')

          old_method = '''    def handle_life_craft(
              self,
              role: dict[str, object],
              fields: list[Field],
          ) -> LifeTransactionResult:
              """Apply one 1143/action-5 craft and persist mutations only."""
              recipe_id = int(fields[1].value)
              slots = [int(field.value) for field in fields[2:6]]
              quantity = int(fields[6].value)
              recipe = self.settings.life_registry.recipe(recipe_id)
          '''
          new_method = '''    def handle_life_craft(
              self,
              role: dict[str, object],
              fields: list[Field],
          ) -> LifeTransactionResult:
              """Apply one normal or direct-use 1143/action-5 transaction."""
              if not (is_life_craft_request(fields) or is_life_direct_use_request(fields)):
                  return LifeTransactionResult((), False, '制造请求格式非法')
              recipe_id = int(fields[1].value)
              if is_life_direct_use_request(fields):
                  # APK db.c_(I) sends the six-field direct-use form without a
                  # quantity byte. It represents exactly one operation and has
                  # no selected material instances; craft_result performs the
                  # same authoritative server-side material lookup used to top
                  # up ordinary craft slots.
                  slots = [0, 0, 0, 0]
                  quantity = 1
              else:
                  slots = [int(field.value) for field in fields[2:6]]
                  quantity = int(fields[6].value)
              recipe = self.settings.life_registry.recipe(recipe_id)
          '''
          if source.count(old_method) != 1:
              raise SystemExit(f'handle_life_craft anchor count={source.count(old_method)}')
          source = source.replace(old_method, new_method, 1)

          old_dispatch = '''                        result = self.handle_life_craft(active_role, fields) if (
                              is_life_craft_request(fields)
                          ) else LifeTransactionResult((), False, '该配方不支持直接使用')
          '''
          new_dispatch = '''                        result = self.handle_life_craft(active_role, fields)
          '''
          if source.count(old_dispatch) != 1:
              raise SystemExit(f'direct-use dispatch anchor count={source.count(old_dispatch)}')
          source = source.replace(old_dispatch, new_dispatch, 1)
          server_path.write_text(source, encoding='utf-8')

          test_path = Path('implementation_staging/tests/test_life_skill_direct_use.py')
          test_path.write_text(r'''"""Regression coverage for the APK's six-field 1143/action-5 direct-use path."""
          from __future__ import annotations

          import tempfile
          import unittest
          from pathlib import Path

          from protocol import byte, decode_frame, encode_frame, field_values, integer
          from server import (
              LocalGameServer,
              Settings,
              default_role,
              ensure_life_skills,
              is_life_direct_use_request,
              life_vitality,
              role_items,
          )


          ALCHEMY_SKILL_ID = 2003
          REFINE_RECIPE_ID = 4001
          INITIAL_STONE_TEMPLATE_ID = 322_260_000
          POTION_TEMPLATE_ID = 260_000_001


          def quantity_for(role: dict[str, object], template_id: int) -> int:
              return sum(
                  int(item.get('quantity', 0))
                  for item in role_items(role)
                  if int(item.get('template_id', 0)) == template_id
                  and item.get('location', 'bag') == 'bag'
              )


          class LifeSkillDirectUseTests(unittest.TestCase):
              def test_direct_use_executes_one_authoritative_craft(self):
                  with tempfile.TemporaryDirectory() as directory:
                      settings = Settings(role_data_file=str(Path(directory) / 'roles.json'))
                      server = LocalGameServer(settings)
                      role = default_role(settings)
                      state = ensure_life_skills(role, settings.life_registry)
                      state['skills'][str(ALCHEMY_SKILL_ID)] = {
                          'level': 1,
                          'proficiency': 0,
                      }
                      state['learned_recipes'] = [REFINE_RECIPE_ID]

                      stones_before = quantity_for(role, INITIAL_STONE_TEMPLATE_ID)
                      potion_before = quantity_for(role, POTION_TEMPLATE_ID)
                      vitality_before = life_vitality(role)

                      fields = decode_frame(encode_frame(1143, [
                          byte(5),
                          integer(REFINE_RECIPE_ID),
                          integer(0), integer(0), integer(0), integer(0),
                      ]))[1]
                      self.assertTrue(is_life_direct_use_request(fields))

                      result = server.handle_life_craft(role, fields)

                      self.assertTrue(result.changed, result.reason)
                      self.assertEqual(
                          quantity_for(role, INITIAL_STONE_TEMPLATE_ID),
                          stones_before - 3,
                      )
                      self.assertEqual(
                          quantity_for(role, POTION_TEMPLATE_ID),
                          potion_before + 1,
                      )
                      self.assertEqual(life_vitality(role), vitality_before - 10)
                      message_id, ack_fields = decode_frame(result.frames[-1])
                      self.assertEqual(message_id, 1143)
                      self.assertEqual(field_values(ack_fields), [5])


          if __name__ == '__main__':
              unittest.main()
          ''', encoding='utf-8')
          PY

      - name: Run focused life-skill tests
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -p 'test_life_skill_direct_use.py' -v

      - name: Run life-skill suite
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -p 'test_life_skills.py' -v

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-life-skill-direct-use-fix.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "chatgpt-github"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support life skill direct-use craft protocol"
          git push origin HEAD:fix/life-skill-direct-use
