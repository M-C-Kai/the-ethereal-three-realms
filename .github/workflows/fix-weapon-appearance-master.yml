name: Fix weapon appearance on master

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-weapon-appearance-master.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply weapon appearance fix and tests
        shell: bash
        run: |
          cd implementation_staging
          python - <<'PY'
          from pathlib import Path

          path = Path('server.py')
          text = path.read_text(encoding='utf-8')
          old = "        integer(source_model if kind == 1 else 0),  # 2: player model source"
          new = "        integer(int(visible_layers.get(7, 0)) if kind == 1 else 0),  # 2: player weapon appearance/property 7"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('battle 1048 field[2] source anchor not found')

          test = Path('tests/test_weapon_appearance_consistency.py')
          test.write_text('''import json\nimport sys\nimport unittest\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\nfrom protocol import decode_frame, field_values\nfrom server import battle_actor_frame\n\n\nclass WeaponAppearanceConsistencyTests(unittest.TestCase):\n    def test_battle_1048_uses_same_weapon_code_as_map_property7(self):\n        weapon_code = 270001\n        frame = battle_actor_frame(\n            actor_id=10001,\n            model=19,\n            name=\'测试角色\',\n            kind=1,\n            side_code=2,\n            slot=1,\n            appearance={7: weapon_code, 14: 0, 15: 0, 16: 0, 17: 0, 18: 0, 19: 0, 20: 0},\n            current_hp=100,\n            max_hp=100,\n        )\n        message_id, fields = decode_frame(frame)\n        self.assertEqual(message_id, 1048)\n        self.assertEqual(field_values(fields)[2], weapon_code)\n\n    def test_battle_1048_has_no_weapon_when_map_property7_is_zero(self):\n        frame = battle_actor_frame(\n            actor_id=10001,\n            model=19,\n            name=\'测试角色\',\n            kind=1,\n            side_code=2,\n            slot=1,\n            appearance={7: 0},\n            current_hp=100,\n            max_hp=100,\n        )\n        _, fields = decode_frame(frame)\n        self.assertEqual(field_values(fields)[2], 0)\n\n    def test_all_preview_weapons_reference_confirmed_nonzero_property7_resources(self):\n        root = Path(__file__).resolve().parents[1]\n        preview = json.loads((root / 'data/catalog/equipment_resource_preview_items.json').read_text(encoding='utf-8'))\n        audit = json.loads((root / 'references/weapon-appearance-audit/property7_candidates.json').read_text(encoding='utf-8'))\n        confirmed = {\n            int(row['property7_low4_candidate'])\n            for row in audit['candidates']\n            if row.get('role_dat_exists') and row.get('weapon_image_exists')\n        }\n        weapons = [row for row in preview['items'] if int(row.get('equipment_slot', 0)) == 10]\n        self.assertTrue(weapons)\n        for row in weapons:\n            code = int(row.get('appearance_properties', {}).get('7', 0))\n            self.assertNotEqual(code, 0, row.get('name'))\n            self.assertIn(code % 10000, confirmed, row.get('name'))\n\n\nif __name__ == '__main__':\n    unittest.main()\n''', encoding='utf-8')

          lock = Path('PROTOCOL_LOCK.md')
          lock_text = lock.read_text(encoding='utf-8')
          marker = '## 战斗武器外观一致性\n'
          if marker not in lock_text:
              lock_text += '''\n\n## 战斗武器外观一致性\n\nAPK 已确认：地图人物的武器外观使用人物属性 `7`；`1048` 的 kind=1 玩家记录中，field[2] 同样必须携带完整武器外观编码，而不能发送人物 model。客户端 `h.f(field2/10)` 用其选择武器人物底板，`h.r()` 使用完整值写入武器槽和品质覆盖层。因此服务端必须让 `1048 field[2] == character_appearance(role)[7]`；未装备武器时两者都为 `0`。这保证地图与战斗使用同一武器资源和品质编码。\n'''
              lock.write_text(lock_text, encoding='utf-8')
          PY
      - name: Run weapon appearance regression
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -p 'test_weapon_appearance_consistency.py' -v
      - name: Run affected battle actor regressions
        working-directory: implementation_staging
        run: |
          python -m unittest \
            tests.test_protocol.ProtocolTests.test_battle_actor_debug_snapshot_does_not_change_1048 \
            tests.test_protocol.ProtocolTests.test_battle_actor_frames_preserve_structure_and_runtime_identity \
            tests.test_protocol.ProtocolTests.test_initial_battle_actor_uses_character_panel_max_hp -v
      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Chenkai"
          git config user.email "58809786+M-C-Kai@users.noreply.github.com"
          rm .github/workflows/fix-weapon-appearance-master.yml
          git add implementation_staging/server.py implementation_staging/tests/test_weapon_appearance_consistency.py implementation_staging/PROTOCOL_LOCK.md .github/workflows/fix-weapon-appearance-master.yml
          git commit -m "fix: keep weapon appearance consistent in battle"
          git push origin master
