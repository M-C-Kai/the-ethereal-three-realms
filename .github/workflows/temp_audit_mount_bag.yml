name: Audit mount bag visibility
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect inventory protocol
        run: |
          echo '=== item/inventory send functions ==='
          git grep -n -I -E 'inventory|bag_item|item_list|item_frame|equipment_slot|location.*bag|kind.*equipment|kind.*mount|mount_state|1009|1016|102[0-9]' -- implementation_staging/*.py implementation_staging/tests || true
          echo '=== server functions around item serialization ==='
          python - <<'PY'
          from pathlib import Path
          p=Path('implementation_staging/server.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          keys=('item_detail','item_frame','inventory','bag','equipment_attributes','equipment_slot','resolved.get(\'kind\')','definition.kind')
          for i,line in enumerate(lines):
              if any(k in line for k in keys):
                  print(f'--- {i+1} ---')
                  for j in range(max(0,i-8), min(len(lines),i+18)):
                      print(f'{j+1}: {lines[j]}')
          PY
      - name: Remove audit workflow
        run: |
          rm .github/workflows/temp_audit_mount_bag.yml
          git config user.name 'M-C-Kai'
          git config user.email '58809786+M-C-Kai@users.noreply.github.com'
          git add .github/workflows/temp_audit_mount_bag.yml
          git commit -m 'ci: remove temporary mount bag audit'
          git push origin HEAD:master
