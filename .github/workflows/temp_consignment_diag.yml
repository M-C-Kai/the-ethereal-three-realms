name: temp-consignment-diag
on:
  push:
    branches: [ feat/item-consignment-market-integrated ]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect server integration points
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('implementation_staging/server.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          for needle, span in [('def item_frame(',90),('class LocalServer',60),('class Server',60),('self.roles',25),('def role_entry_frames(',35)]:
              print('\n###',needle)
              for i,l in enumerate(lines):
                  if needle in l:
                      print('\n'.join(f'{j+1}: {lines[j]}' for j in range(i,min(len(lines),i+span))))
                      break
          PY
