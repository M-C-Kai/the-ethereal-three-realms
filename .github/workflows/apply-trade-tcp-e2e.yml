name: apply-trade-tcp-e2e

on:
  push:
    branches: [feat/consignment-full-flow-20260912]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Capture repository baseline without the new TCP RED test
        shell: bash
        run: |
          mv implementation_staging/tests/test_trade_tcp_e2e.py /tmp/test_trade_tcp_e2e.py
          set +e
          (cd implementation_staging && python -m unittest discover -s tests -v) > /tmp/trade-tcp-baseline.log 2>&1
          set -e
          grep -E '^(FAIL|ERROR): ' /tmp/trade-tcp-baseline.log \
            | sed -E 's/^(FAIL|ERROR): ([^ ]+).*/\1 \2/' \
            | sort -u > /tmp/trade-tcp-baseline.names || true
          mv /tmp/test_trade_tcp_e2e.py implementation_staging/tests/test_trade_tcp_e2e.py
          git reset --hard HEAD
          echo "baseline failures: $(wc -l < /tmp/trade-tcp-baseline.names)"
          test "$(wc -l < /tmp/trade-tcp-baseline.names)" -eq 31

      - name: Route every server instance to its configured trade ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('implementation_staging/server.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one marker, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "    role_data_file: str = 'data/roles.json'\n",
              "    role_data_file: str = 'data/roles.json'\n    consignment_data_file: str = 'data/consignment_listings.json'\n",
              'Settings consignment_data_file',
          )
          replace_once(
              """        self.accounts = AccountStore(settings)\n        self.roles = RoleStore(settings)\n        self.character_update_bus = build_character_update_bus()\n""",
              """        self.accounts = AccountStore(settings)\n        self.roles = RoleStore(settings)\n        configured_consignment = Path(settings.consignment_data_file)\n        self.consignment_data_file = (\n            configured_consignment\n            if configured_consignment.is_absolute()\n            else Path(__file__).resolve().parent / configured_consignment\n        )\n        self.character_update_bus = build_character_update_bus()\n""",
              'LocalGameServer trade path',
          )
          replace_once(
              "        consignment = ConsignmentService(self.roles, self.settings.item_registry)\n",
              """        consignment = ConsignmentService(\n            self.roles,\n            self.settings.item_registry,\n            self.consignment_data_file,\n        )\n""",
              'connection consignment service',
          )
          path.write_text(text, encoding='utf-8')

          config = Path('implementation_staging/config.json')
          config_text = config.read_text(encoding='utf-8')
          old = '  "role_data_file": "data/roles.json"\n}'
          new = '  "role_data_file": "data/roles.json",\n  "consignment_data_file": "data/consignment_listings.json"\n}'
          if config_text.count(old) != 1:
              raise SystemExit('config trade path marker changed')
          config.write_text(config_text.replace(old, new, 1), encoding='utf-8')

          doc = Path('implementation_staging/TRADE_SYSTEM.md')
          doc_text = doc.read_text(encoding='utf-8')
          needle = '`data/consignment_listings.json` 同时保存：\n'
          replacement = (
              '`consignment_data_file`（默认 `data/consignment_listings.json`）可按服务器实例独立配置，文件同时保存：\n'
          )
          if doc_text.count(needle) != 1:
              raise SystemExit('trade doc path marker changed')
          doc.write_text(doc_text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Verify real encrypted TCP seller-to-buyer lifecycle
        working-directory: implementation_staging
        run: |
          python -m py_compile server.py consignment_service.py consignment_protocol.py
          python -m unittest tests.test_trade_tcp_e2e -v

      - name: Verify complete trade and native protocol contracts
        working-directory: implementation_staging
        run: |
          python -m unittest \
            tests.test_trade_system \
            tests.test_trade_order_history \
            tests.test_consignment_service \
            tests.test_consignment_protocol \
            tests.test_consignment_server_contract \
            tests.test_consignment_category_entry \
            tests.test_consignment_entry \
            tests.test_consignment_categories -v

      - name: Prove no new full-suite regression
        shell: bash
        run: |
          set +e
          (cd implementation_staging && python -m unittest discover -s tests -v) > /tmp/trade-tcp-after.log 2>&1
          set -e
          grep -E '^(FAIL|ERROR): ' /tmp/trade-tcp-after.log \
            | sed -E 's/^(FAIL|ERROR): ([^ ]+).*/\1 \2/' \
            | sort -u > /tmp/trade-tcp-after.names || true
          echo "after failures: $(wc -l < /tmp/trade-tcp-after.names)"
          diff -u /tmp/trade-tcp-baseline.names /tmp/trade-tcp-after.names

      - name: Commit verified TCP trade integration and clean temporary CI
        shell: bash
        run: |
          rm -f .github/workflows/verify-trade-tcp-e2e.yml
          rm -f .github/workflows/apply-trade-tcp-e2e.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add implementation_staging/server.py \
                  implementation_staging/config.json \
                  implementation_staging/TRADE_SYSTEM.md \
                  implementation_staging/tests/test_trade_tcp_e2e.py \
                  .github/workflows
          git commit -m "test: verify complete trade lifecycle over real TCP [GREEN]"
          git push
