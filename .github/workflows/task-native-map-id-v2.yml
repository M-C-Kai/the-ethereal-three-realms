name: task-native-map-id-v2

on:
  push:
    branches: ['fix/task-native-map-id-v2']
    paths:
      - '.github/workflows/task-native-map-id-v2.yml'

permissions:
  contents: write

jobs:
  test-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/task-native-map-id-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm regression is red before production fix
        working-directory: implementation_staging
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_task_minimum_flow.TaskMinimumFlowTests.test_1110_world_descriptor_sets_native_logical_map_id_in_field_zero -v
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'Regression unexpectedly passed before server fix'
            exit 1
          fi
          echo 'Expected RED confirmed'
      - name: Apply native 1110 field-order fix
        working-directory: implementation_staging
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.py')
          s = p.read_text(encoding='utf-8')
          old_lines = [
              '    # 1110 字段 1/2 are the logical map id used by the client. The patched',
              '    # APK carries the matching 50000.map.ref alias for the target map.',
              '    client_map_id = current_map.id',
              '    world = encode_frame(1110, [',
              '        integer(0),',
              '        integer(client_map_id),',
              '        integer(client_map_id),',
              '        string(current_map.name),',
              '    ])',
          ]
          new_lines = [
              '    # APK main/e stores 1110 as logical map id (field 0), resource map id',
              '    # (field 1), map flags (field 2), and map name (field 3). Task screens',
              '    # compare m.q() (field 0) to route map id before same-map local pathing.',
              '    client_map_id = current_map.id',
              '    world = encode_frame(1110, [',
              '        integer(client_map_id),',
              '        integer(client_map_id),',
              '        integer(0),',
              '        string(current_map.name),',
              '    ])',
          ]
          old = '\n'.join(old_lines)
          new = '\n'.join(new_lines)
          if old not in s:
              raise SystemExit('current notice_and_world 1110 block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify targeted regression
        working-directory: implementation_staging
        run: python -m unittest tests.test_task_minimum_flow -v
      - name: Verify task suite has no new failures beyond master baseline
        working-directory: implementation_staging
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_task_*.py' -v > /tmp/task-suite.log 2>&1
          code=$?
          set -e
          cat /tmp/task-suite.log
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          grep -q '^ERROR: test_native_action8_accept_progress_claim_round_trip_persists_state_and_rewards' /tmp/task-suite.log
          grep -q '^ERROR: test_task_npc_coordinate_is_allowed_by_shared_pathfinder' /tmp/task-suite.log
          grep -q 'FAILED (errors=2)' /tmp/task-suite.log
          if grep -q '^FAIL:' /tmp/task-suite.log; then
            echo 'Unexpected assertion failure detected'
            exit 1
          fi
          error_count=$(grep -c '^ERROR:' /tmp/task-suite.log)
          if [ "$error_count" -ne 2 ]; then
            echo "Unexpected task integration error count: $error_count"
            exit 1
          fi
          echo 'Only the two pre-existing latest-master task integration API drift errors remain'
      - name: Compile server
        working-directory: implementation_staging
        run: python -m py_compile server.py
      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add implementation_staging/server.py
          git rm .github/workflows/task-native-map-id-v2.yml
          git commit -m 'fix(tasks): restore native same-map task auto-pathing'
          git push origin HEAD:fix/task-native-map-id-v2
