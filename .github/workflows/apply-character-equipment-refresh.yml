name: Apply character equipment refresh

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-character-equipment-refresh.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record full-suite baseline
        working-directory: implementation_staging
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-before.log 2>&1
          status=$?
          set -e
          echo "baseline_exit=$status"
          grep -E ' \.\.\. (FAIL|ERROR)$' /tmp/full-before.log | sort > /tmp/fail-before.txt || true
          echo '=== baseline failing tests ==='
          cat /tmp/fail-before.txt

      - name: Prove regression tests are red before patch
        working-directory: implementation_staging
        run: |
          cat > tests/test_character_equipment_refresh_red.py <<'PY'
          import unittest
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path(__file__).resolve().parents[1]))

          from protocol import decode_frame, field_values
          import server as server_module


          class CharacterRefreshRedTests(unittest.TestCase):
              def setUp(self):
                  self.settings = server_module.Settings()
                  self.role = server_module.default_role(self.settings)

              def _equipment_in_slot(self, slot):
                  return next(
                      item for item in server_module.role_items(self.role)
                      if server_module.item_slot(item, self.settings.item_registry) == slot
                  )

              def test_1080_must_use_level_and_equipped_appearance(self):
                  self.role['level'] = 17
                  self.role['race'] = 2
                  self.role['gender'] = 1
                  weapon = self._equipment_in_slot(10)
                  weapon['location'] = 'equipped'
                  _, fields = decode_frame(server_module.role_list(self.settings, [self.role]))
                  record = field_values(fields)[2:17]
                  appearance = server_module.character_appearance(self.role, self.settings.item_registry)
                  self.assertEqual(record[1], 17)
                  self.assertEqual(record[2], appearance[7])

              def test_character_panel_must_include_equipped_defence(self):
                  shoulder = self._equipment_in_slot(2)
                  shoulder['location'] = 'equipped'
                  shoulder['equipment_attributes'] = [0, 7, 0, 0]
                  attributes, _ = server_module.character_panel_frames(self.role)
                  _, fields = decode_frame(attributes)
                  values = field_values(fields)
                  base_defence = max(0, int(self.role['stats'][1]))
                  self.assertEqual(values[-4], base_defence + 7)

              def test_unified_refresh_helper_must_exist(self):
                  self.assertTrue(hasattr(server_module, 'character_equipment_refresh_frames'))


          if __name__ == '__main__':
              unittest.main()
          PY

          set +e
          python -m unittest discover -s tests -p 'test_character_equipment_refresh_red.py' -v > /tmp/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/red.log
          rm tests/test_character_equipment_refresh_red.py
          if [ "$red_status" -eq 0 ]; then
            echo 'Expected pre-patch regression tests to fail, but they passed.' >&2
            exit 1
          fi
          grep -q 'FAILED' /tmp/red.log
          echo 'RED confirmed: current master reproduces the refresh-chain defects.'

      - name: Apply production patch
        run: |
          python .github/scripts/apply_character_panel_refresh.py

      - name: Append strengthening refresh regression
        working-directory: implementation_staging
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_character_equipment_refresh.py')
          text = path.read_text(encoding='utf-8')
          marker = "\n\nif __name__ == '__main__':\n    unittest.main()\n"
          if marker not in text:
              raise SystemExit('test main marker missing')
          addition = '''

          class _AlwaysSuccessRng:
              def randrange(self, stop):
                  return 0


          class CharacterStrengtheningRefreshTests(unittest.TestCase):
              def test_strengthening_equipped_weapon_appends_1017_and_1039_refresh(self):
                  import server as server_module
                  from strengthening import INITIAL_STRENGTHEN_STONE_TEMPLATE_ID

                  settings = server_module.Settings()
                  role = server_module.default_role(settings)
                  weapon = next(
                      item for item in server_module.role_items(role)
                      if server_module.item_slot(item, settings.item_registry) == 10
                  )
                  stone = next(
                      item for item in server_module.role_items(role)
                      if int(item.get('template_id', 0)) == INITIAL_STRENGTHEN_STONE_TEMPLATE_ID
                  )
                  weapon['location'] = 'equipped'
                  server_module.ensure_weapon_base_attributes(weapon, settings.item_registry)

                  game_server = server_module.LocalGameServer(settings)
                  game_server.roles.save = lambda: None
                  frames = game_server.handle_strengthening_request(
                      role,
                      [92, int(weapon['id']), int(stone['id']), 5],
                      rng=_AlwaysSuccessRng(),
                  )

                  message_ids = [decode_frame(frame)[0] for frame in frames]
                  self.assertGreaterEqual(len(message_ids), 2)
                  self.assertEqual(message_ids[-2:], [1017, 1039])
                  _, refresh_fields = decode_frame(frames[-1])
                  self.assertEqual(field_values(refresh_fields)[0], 1)
          '''
          # The YAML block strips its own indentation; remove the intentional
          # ten-space Python-string margin before inserting into the test file.
          addition = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in addition.splitlines()
          )
          path.write_text(text.replace(marker, addition + marker), encoding='utf-8')
          PY

      - name: Run focused refresh and affected regressions
        working-directory: implementation_staging
        run: |
          python -m py_compile server.py
          python -m unittest discover -s tests -p 'test_character_equipment_refresh.py' -v
          python -m unittest discover -s tests -p 'test_strengthening.py' -v
          python -m unittest discover -s tests -p 'test_inventory.py' -v
          python -m unittest discover -s tests -p 'test_weapon_appearance_consistency.py' -v
          python -m unittest discover -s tests -p 'test_armor_appearance_mapping.py' -v
          python -m unittest discover -s tests -p 'test_armor_downlink.py' -v
          python -m unittest discover -s tests -p 'test_helmet_appearance_mapping.py' -v
          python -m unittest discover -s tests -p 'test_leg_armor_appearance_mapping.py' -v
          python -m unittest discover -s tests -p 'test_shoe_appearance_mapping.py' -v
          git diff --check

      - name: Compare full-suite failures with baseline
        working-directory: implementation_staging
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-after.log 2>&1
          status=$?
          set -e
          echo "after_exit=$status"
          grep -E ' \.\.\. (FAIL|ERROR)$' /tmp/full-after.log | sort > /tmp/fail-after.txt || true
          echo '=== after-patch failing tests ==='
          cat /tmp/fail-after.txt
          echo '=== newly failing tests ==='
          comm -13 /tmp/fail-before.txt /tmp/fail-after.txt > /tmp/new-failures.txt || true
          cat /tmp/new-failures.txt
          if [ -s /tmp/new-failures.txt ]; then
            echo 'Patch introduced new full-suite failures.' >&2
            tail -n 160 /tmp/full-after.log
            exit 1
          fi
          echo 'No new full-suite failures compared with baseline.'
          tail -n 60 /tmp/full-after.log

      - name: Commit production patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add implementation_staging/server.py implementation_staging/tests/test_character_equipment_refresh.py
          git diff --cached --check
          git commit -m 'fix: synchronize character equipment refresh chain'
          git push origin HEAD:master
