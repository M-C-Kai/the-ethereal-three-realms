name: Audit global 41004 mount references

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp_global_mount_audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Global text audit
        run: |
          echo '=== 41004 ==='
          git grep -n -I -E '41004|170410004|mount_model[^0-9]*1004|辟邪' -- . ':!*.png' ':!*.dat' ':!*.o' || true
          echo '=== mount related files ==='
          git ls-files | grep -Ei 'mount|shop|item|role|starter' || true
      - name: Remove audit workflow
        run: |
          rm .github/workflows/temp_global_mount_audit.yml
          git config user.name 'M-C-Kai'
          git config user.email '58809786+M-C-Kai@users.noreply.github.com'
          git add .github/workflows/temp_global_mount_audit.yml
          git commit -m 'ci: remove temporary global mount audit'
          git push origin HEAD:master
