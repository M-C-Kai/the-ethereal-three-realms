name: Apply armor downlink correction
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-armor-downlink-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch armor downlink
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('implementation_staging')
          server = root / 'server.py'
          text = server.read_text(encoding='utf-8')

          def replace_once(src: str, old: str, new: str, label: str) -> str:
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return src.replace(old, new, 1)

          text = replace_once(
              text,
              "from item_registry import (\n    ItemRegistry,\n    battle_weapon_field2_from_icon,\n    default_item_registry,\n)",
              "from item_registry import (\n    ItemRegistry,\n    armor_property2_from_icon,\n    battle_weapon_field2_from_icon,\n    default_item_registry,\n)",
              'server item_registry import',
          )

          text = replace_once(
              text,
              "BASE_CHARACTER_APPEARANCE = {\n    7: 0,",
              "BASE_CHARACTER_APPEARANCE = {\n    2: 0,   # 铠甲主体：property2 -> image 14000..14030\n    7: 0,",
              'base appearance property2',
          )

          text = replace_once(
              text,
              "        resolved = registry.resolve(item) if registry is not None else item\n        appearance = resolved.get('appearance_properties', {})",
              "        resolved = registry.resolve(item) if registry is not None else item\n        slot = int(resolved.get('equipment_slot', 0))\n        if slot == 3:\n            # 铠甲只从 armor_appearance_mapping.json 取 property2；未知映射不猜。\n            armor_value = armor_property2_from_icon(int(resolved.get('icon_code', 0)))\n            if armor_value is not None:\n                properties[2] = int(armor_value)\n        appearance = resolved.get('appearance_properties', {})",
              'character appearance armor lookup',
          )

          text = replace_once(
              text,
              "            index = int(property_index)\n            if index in BASE_CHARACTER_APPEARANCE:",
              "            index = int(property_index)\n            if slot == 3 and index in {2, 15}:\n                # 旧铠甲 property15 以及模板内硬编码 property2 都不得覆盖资料库。\n                continue\n            if index in BASE_CHARACTER_APPEARANCE:",
              'ignore legacy armor property15',
          )

          old_comment = (
              "# The player sprite is composed from independently replaceable image layers.\n"
              "# Property 7 selects the weapon family; properties 14..20 select trousers,\n"
              "# armour, shoulders, wrists, boots, cape and helmet respectively. Zero is the\n"
              "# unequipped state (property 14 resolves zero to the bundled base trousers)."
          )
          if old_comment in text:
              text = text.replace(
                  old_comment,
                  "# The player sprite is composed from independently replaceable image layers.\n"
                  "# Property 2 is the armor/body layer and resolves to image 14000..14030.\n"
                  "# Property 7 is the weapon; properties 14..20 are other independent overlays.\n"
                  "# Slot-3 armor must never be routed through legacy property15.",
                  1,
              )

          server.write_text(text, encoding='utf-8')

          # Update preview metadata so the catalog description no longer calls armor a generic layer candidate.
          generator = root / 'tools' / 'build_equipment_resource_preview_items.py'
          g = generator.read_text(encoding='utf-8')
          old_note = (
              "                '头盔 property20 只读取 helmet_appearance_mapping.json；当前无已证实 icon→property20 对应，全部未解析图标不猜。'\n"
              "                '其他防具 appearance_properties 仍引用 appearance-layer-audit 人物图层候选。'"
          )
          new_note = (
              "                '头盔 property20 只读取 helmet_appearance_mapping.json；未解析图标不猜。'\n"
              "                '铠甲只读取 armor_appearance_mapping.json，并使用 property2 / 14000..14030；严禁再使用 property15。'\n"
              "                '其他防具 appearance_properties 仍引用 appearance-layer-audit 人物图层候选。'"
          )
          g = replace_once(g, old_note, new_note, 'preview metadata armor note')
          generator.write_text(g, encoding='utf-8')

          # Add a focused regression test for the actual downlink path.
          test_file = root / 'tests' / 'test_armor_downlink.py'
          test_file.write_text('''import sys\nimport unittest\nfrom pathlib import Path\nfrom unittest.mock import patch\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\nfrom server import (\n    BASE_CHARACTER_APPEARANCE,\n    Settings,\n    character_appearance,\n    default_role,\n    role_items,\n)\n\n\nclass ArmorDownlinkTests(unittest.TestCase):\n    def _role_with_only_armor_equipped(self):\n        settings = Settings()\n        role = default_role(settings)\n        armor = None\n        for item in role_items(role):\n            item[\"location\"] = \"bag\"\n            resolved = settings.item_registry.resolve(item)\n            if int(resolved.get(\"equipment_slot\", 0)) == 3:\n                armor = item\n        self.assertIsNotNone(armor)\n        armor[\"location\"] = \"equipped\"\n        return settings, role, armor\n\n    def test_base_snapshot_explicitly_clears_legacy_property15_and_has_property2(self):\n        self.assertIn(2, BASE_CHARACTER_APPEARANCE)\n        self.assertEqual(BASE_CHARACTER_APPEARANCE[2], 0)\n        self.assertEqual(BASE_CHARACTER_APPEARANCE[15], 0)\n        settings, role, _ = self._role_with_only_armor_equipped()\n        appearance = character_appearance(role, settings.item_registry)\n        self.assertEqual(appearance[2], 0)\n        self.assertEqual(appearance[15], 0)\n\n    def test_confirmed_catalog_value_is_downlinked_as_property2(self):\n        settings, role, _ = self._role_with_only_armor_equipped()\n        with patch(\"server.armor_property2_from_icon\", return_value=12):\n            appearance = character_appearance(role, settings.item_registry)\n        self.assertEqual(appearance[2], 12)\n        self.assertEqual(appearance[15], 0)\n\n    def test_stale_armor_template_property15_cannot_reappear(self):\n        settings, role, _ = self._role_with_only_armor_equipped()\n        real_resolve = settings.item_registry.resolve\n\n        def stale_resolve(item):\n            resolved = real_resolve(item)\n            if int(resolved.get(\"equipment_slot\", 0)) == 3:\n                resolved[\"appearance_properties\"] = {\"15\": 34, \"2\": 30}\n            return resolved\n\n        with patch.object(settings.item_registry, \"resolve\", side_effect=stale_resolve):\n            with patch(\"server.armor_property2_from_icon\", return_value=7):\n                appearance = character_appearance(role, settings.item_registry)\n        self.assertEqual(appearance[2], 7)\n        self.assertEqual(appearance[15], 0)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n''', encoding='utf-8')

          # Correct the protocol lock text that still described property15 as armor.
          lock = root / 'PROTOCOL_LOCK.md'
          p = lock.read_text(encoding='utf-8')
          p = p.replace(
              '| 14 | 腿甲/裤腿 |\n| 15 | 铠甲/胸部 |\n| 16 | 肩甲 |',
              '| 2 | 铠甲主体；`property2=N` 对应人物 layer3 的 `14000+N`，APK 已确认资源范围 `14000..14030` |\n| 14 | 腿甲/裤腿 |\n| 15 | 非铠甲；保留为独立人物覆盖层，槽3不得写入 |\n| 16 | 肩甲 |',
              1,
          )
          marker = '## 铠甲人物外观下发锁定'
          if marker not in p:
              p += '''\n\n## 铠甲人物外观下发锁定\n\n铠甲装备槽固定为 `3`。APK `pmsj/work/b/v.smali` 已确认铠甲主体使用人物属性 `2`，客户端写入人物 layer3，并按 `image_id = 14000 + property2` 选择 `0014000_71x32.png` 到 `0014030_71x32.png`。\n\n服务端运行时只允许从 `data/catalog/armor_appearance_mapping.json` 读取 `icon_code -> property2`。槽3装备中遗留的 `appearance_properties[\"15\"]` 必须忽略；即使旧模板或旧缓存仍含该字段，也不得再次下发为铠甲。完整人物外观快照必须包含 `property2`，同时 `property15=0` 可清除历史错误铠甲覆盖层。没有确认的 icon 映射时只保持默认 `property2=0`，不得循环、按尾号或按颜色猜测。\n'''
          lock.write_text(p, encoding='utf-8')
          PY
      - name: Regenerate preview catalog
        working-directory: implementation_staging
        env:
          PYTHONPATH: .
        run: python tools/build_equipment_resource_preview_items.py
      - name: Run armor and registry regressions
        working-directory: implementation_staging
        run: |
          python -m unittest tests.test_armor_appearance_mapping tests.test_armor_downlink tests.test_item_registry tests.test_helmet_appearance_mapping
      - name: Verify no slot3 property15 remains in catalogs
        working-directory: implementation_staging
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for rel in ['data/catalog/items.json', 'data/catalog/equipment_resource_preview_items.json']:
              data = json.loads(Path(rel).read_text(encoding='utf-8'))
              for item in data['items']:
                  if int(item.get('equipment_slot', 0)) == 3:
                      assert '15' not in item.get('appearance_properties', {}), (rel, item.get('icon_code'))
          print('slot3 catalogs contain no property15')
          PY
      - name: Commit verified changes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-armor-downlink-fix.yml
          git config user.name 'M-C-Kai'
          git config user.email '58809786+M-C-Kai@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: resend armor appearance through property2'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
