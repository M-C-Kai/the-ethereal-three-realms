name: baseline-consignment-regression

on:
  push:
    branches: [feat/consignment-full-flow-20260912]
    paths:
      - '.github/workflows/baseline-consignment-regression.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture current full-suite baseline
        working-directory: implementation_staging
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full.log 2>&1
          status=$?
          set -e
          cat /tmp/full.log
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/full.log').read_text(encoding='utf-8', errors='replace')
          failures = sorted(set(re.findall(r'^(?:FAIL|ERROR):\s+([^\n]+)', text, re.M)))
          print('=== BASELINE FAILURE SET ===')
          for name in failures:
              print(name)
          print('=== BASELINE COUNT ===', len(failures))
          PY
          echo "full-suite-exit=$status (captured as baseline; expected repository-wide reds are not changed here)"
