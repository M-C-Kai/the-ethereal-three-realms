name: Unify weapon battle appearance mapping v2

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/unify-weapon-battle-mapping-v2.yml'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Apply icon-to-battle weapon mapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('implementation_staging')

          path = root / 'item_registry.py'
          text = path.read_text(encoding='utf-8')
          anchor = "PREVIEW_SERIAL_COLLISION_OFFSET = 50_000\n"
          block = '''PREVIEW_SERIAL_COLLISION_OFFSET = 50_000\n\n# User-confirmed visual mapping between equipment icon groups (21..33) and\n# the APK battle weapon image families.  This is a compatibility mapping\n# derived from the side-by-side resource sheets; it is not claimed to be\n# official server metadata.\nWEAPON_ICON_GROUP_TO_BATTLE_FAMILY = {\n    21: 220,\n    22: 260,\n    23: 271,\n    24: 250,\n    25: 231,\n    26: 280,\n    27: 242,\n    28: 240,\n    29: 241,\n    30: 221,\n    31: 290,\n    32: 270,\n    33: 230,\n}\n\n\ndef battle_weapon_image_from_icon(icon_code: int) -> int:\n    \"\"\"Map one 21xx..33xx weapon icon to its battle image id.\n\n    Each icon group exposes ten variants. Family 271 starts at 27101 rather\n    than 27100. Family 231 has two extra APK images (23110/23111) which are\n    intentionally not mapped because icon group 25 has only ten entries.\n    Unknown groups/variants return zero instead of inventing an appearance.\n    \"\"\"\n    code = int(icon_code)\n    group = code // 100\n    variant = code % 100\n    family = WEAPON_ICON_GROUP_TO_BATTLE_FAMILY.get(group)\n    if family is None or not 0 <= variant <= 9:\n        return 0\n    return (family * 100) + variant + (1 if family == 271 else 0)\n\n\ndef battle_weapon_field2_from_icon(icon_code: int, quality: int) -> int:\n    \"\"\"Build APK 1048 field[2]: battle image * 10 + quality selector.\"\"\"\n    image_id = battle_weapon_image_from_icon(icon_code)\n    quality_value = int(quality)\n    if image_id == 0 or not 0 <= quality_value <= 9:\n        return 0\n    return image_id * 10 + quality_value\n'''
          if 'WEAPON_ICON_GROUP_TO_BATTLE_FAMILY' not in text:
              if anchor not in text:
                  raise SystemExit('item_registry mapping anchor not found')
              text = text.replace(anchor, block, 1)
          path.write_text(text, encoding='utf-8')

          path = root / 'server.py'
          text = path.read_text(encoding='utf-8')
          old_import = "from item_registry import (\n    ItemRegistry,\n    default_item_registry,\n)"
          new_import = "from item_registry import (\n    ItemRegistry,\n    battle_weapon_field2_from_icon,\n    default_item_registry,\n)"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif 'battle_weapon_field2_from_icon' not in text.split('from map_registry import', 1)[0]:
              raise SystemExit('server item_registry import anchor not found')

          combat_anchor = "\ndef combat_stats(role: dict[str, object]) -> CombatStats:\n"
          helper = '''\ndef equipped_weapon_battle_field2(\n    role: dict[str, object],\n    registry: ItemRegistry | None = None,\n) -> int:\n    \"\"\"Return APK 1048 field[2] for the currently equipped slot-10 weapon.\n\n    Map property7 and battle field[2] use different resource namespaces.\n    The equipment icon is the shared source of truth; the battle value is\n    derived through the user-confirmed icon-group -> battle-family mapping.\n    \"\"\"\n    if registry is None:\n        registry = default_item_registry()\n    weapon = next(\n        (\n            item\n            for item in role_items(role)\n            if item.get('location') == 'equipped'\n            and is_equipment(item)\n            and item_slot(item, registry) == 10\n        ),\n        None,\n    )\n    if weapon is None:\n        return 0\n    resolved = registry.resolve(weapon)\n    return battle_weapon_field2_from_icon(\n        int(resolved.get('icon_code', 0)),\n        int(resolved.get('quality', 0)),\n    )\n\n'''
          if 'def equipped_weapon_battle_field2(' not in text:
              if combat_anchor not in text:
                  raise SystemExit('server combat_stats anchor not found')
              text = text.replace(combat_anchor, helper + combat_anchor, 1)

          old_sig = "    appearance: dict[int, int] | None = None,\n    current_hp: int = 100,"
          new_sig = "    appearance: dict[int, int] | None = None,\n    weapon_field2: int = 0,\n    current_hp: int = 100,"
          if old_sig in text:
              text = text.replace(old_sig, new_sig, 1)
          elif 'weapon_field2: int = 0' not in text:
              raise SystemExit('battle_actor_frame signature anchor not found')

          old_field2 = "        integer(int(visible_layers.get(7, 0)) if kind == 1 else 0),  # 2: player weapon appearance/property 7"
          new_field2 = "        integer(max(0, int(weapon_field2)) if kind == 1 else 0),  # 2: battle weapon image*10 + quality"
          if old_field2 in text:
              text = text.replace(old_field2, new_field2, 1)
          elif new_field2 not in text:
              raise SystemExit('battle field2 anchor not found')

          appearance_call = "            appearance=character_appearance(role, getattr(settings, 'item_registry', None)),\n"
          battle_call = appearance_call + "            weapon_field2=equipped_weapon_battle_field2(role, getattr(settings, 'item_registry', None)),\n"
          if appearance_call in text:
              text = text.replace(appearance_call, battle_call)
          elif 'weapon_field2=equipped_weapon_battle_field2' not in text:
              raise SystemExit('battle actor call anchors not found')

          old_doc = "    field 2/0 (model source), field 5 (side/category), and field 8 (battle\n"
          new_doc = "    field 2 (battle weapon image/quality for kind=1), field 0 (model source),\n    field 5 (side/category), and field 8 (battle\n"
          if old_doc in text:
              text = text.replace(old_doc, new_doc, 1)
          path.write_text(text, encoding='utf-8')

          test = root / 'tests' / 'test_weapon_appearance_consistency.py'
          test.write_text('''import json\nimport sys\nimport unittest\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\nfrom item_registry import (\n    WEAPON_ICON_GROUP_TO_BATTLE_FAMILY,\n    battle_weapon_field2_from_icon,\n    battle_weapon_image_from_icon,\n    default_item_registry,\n)\nfrom protocol import decode_frame, field_values\nfrom server import (\n    Settings,\n    battle_actor_frame,\n    battle_actor_frames,\n    character_appearance,\n    equipped_weapon_battle_field2,\n)\n\nEXPECTED_FAMILIES = {\n    21: 220, 22: 260, 23: 271, 24: 250, 25: 231, 26: 280, 27: 242,\n    28: 240, 29: 241, 30: 221, 31: 290, 32: 270, 33: 230,\n}\n\nclass WeaponAppearanceConsistencyTests(unittest.TestCase):\n    def test_user_confirmed_icon_group_to_battle_family_mapping(self):\n        self.assertEqual(WEAPON_ICON_GROUP_TO_BATTLE_FAMILY, EXPECTED_FAMILIES)\n\n    def test_all_130_weapon_icons_follow_extracted_battle_family_rows(self):\n        root = Path(__file__).resolve().parents[1]\n        manifest = json.loads((root / 'references/battle-weapon-appearance-audit/manifest.json').read_text(encoding='utf-8'))\n        families = manifest['battle_weapon_families']\n        for icon_group, battle_family in EXPECTED_FAMILIES.items():\n            extracted = [int(value) for value in families[str(battle_family)]]\n            self.assertGreaterEqual(len(extracted), 10, battle_family)\n            mapped_images = extracted[:10]\n            for variant, expected_image in enumerate(mapped_images):\n                icon_code = icon_group * 100 + variant\n                self.assertEqual(battle_weapon_image_from_icon(icon_code), expected_image, icon_code)\n                self.assertEqual(battle_weapon_field2_from_icon(icon_code, 1), expected_image * 10 + 1, icon_code)\n\n    def test_group_25_uses_first_ten_of_twelve_231_family_images(self):\n        self.assertEqual(battle_weapon_image_from_icon(2500), 23100)\n        self.assertEqual(battle_weapon_image_from_icon(2509), 23109)\n\n    def test_special_23_group_uses_27101_through_27110(self):\n        self.assertEqual(battle_weapon_image_from_icon(2300), 27101)\n        self.assertEqual(battle_weapon_image_from_icon(2309), 27110)\n        self.assertEqual(battle_weapon_field2_from_icon(2300, 1), 271011)\n        self.assertEqual(battle_weapon_field2_from_icon(2309, 1), 271101)\n\n    def test_unknown_group_variant_or_quality_never_invents_battle_appearance(self):\n        self.assertEqual(battle_weapon_image_from_icon(2000), 0)\n        self.assertEqual(battle_weapon_image_from_icon(2110), 0)\n        self.assertEqual(battle_weapon_field2_from_icon(2100, 10), 0)\n\n    def test_equipped_weapon_icon_drives_1048_field2_independently_of_map_property7(self):\n        root = Path(__file__).resolve().parents[1]\n        preview = json.loads((root / 'data/catalog/equipment_resource_preview_items.json').read_text(encoding='utf-8'))\n        item = next(row for row in preview['items'] if int(row.get('equipment_slot', 0)) == 10 and int(row.get('icon_code', 0)) == 3200)\n        registry = default_item_registry()\n        role = {\n            'id': 10001, 'name': '测试角色', 'model': 19,\n            'items': [{'id': 1, 'template_id': int(item['template_id']), 'quantity': 1, 'location': 'equipped'}],\n        }\n        self.assertGreater(character_appearance(role, registry)[7], 0)\n        self.assertEqual(equipped_weapon_battle_field2(role, registry), 270001)\n        settings = Settings(item_registry=registry)\n        message_id, fields = decode_frame(battle_actor_frames(role, settings)[0])\n        self.assertEqual(message_id, 1048)\n        self.assertEqual(field_values(fields)[2], 270001)\n\n    def test_battle_actor_frame_uses_explicit_battle_weapon_code(self):\n        frame = battle_actor_frame(\n            actor_id=10001, model=19, name='测试角色', kind=1, side_code=2, slot=1,\n            appearance={7: 333003}, weapon_field2=220001, current_hp=100, max_hp=100,\n        )\n        message_id, fields = decode_frame(frame)\n        self.assertEqual(message_id, 1048)\n        self.assertEqual(field_values(fields)[2], 220001)\n\n    def test_no_equipped_weapon_sends_zero_battle_weapon(self):\n        registry = default_item_registry()\n        role = {'id': 10001, 'name': '测试角色', 'model': 19, 'items': []}\n        self.assertEqual(equipped_weapon_battle_field2(role, registry), 0)\n\nif __name__ == '__main__':\n    unittest.main()\n''', encoding='utf-8')

          lock = root / 'PROTOCOL_LOCK.md'
          lock_text = lock.read_text(encoding='utf-8')
          marker = '\n\n## 战斗武器外观一致性\n'
          if marker not in lock_text:
              raise SystemExit('PROTOCOL_LOCK weapon section not found')
          prefix = lock_text.split(marker, 1)[0]
          lock.write_text(prefix + '''\n\n## 战斗武器外观一致性\n\nAPK 已确认地图人物 `property7` 与战斗 `1048 field[2]` 属于**不同资源命名空间**，禁止再令两者数值相等。地图 `property7` 选择地图人物武器复合层（40000..49999 资源）；战斗 `field[2]` 按 `field2 / 10 = battle weapon image`、`field2 % 10 = quality overlay selector` 解释。历史样本 `270001` 因此解析为 battle image `27000` + quality `1`。\n\n兼容服以装备 `icon_code` 作为共同来源：地图继续由装备模板的 `appearance_properties[7]` 生成 `property7`；战斗使用人工视觉核对后的 icon group → battle family 映射生成 `field[2]`。当前映射为 `21→220, 22→260, 23→271, 24→250, 25→231, 26→280, 27→242, 28→240, 29→241, 30→221, 31→290, 32→270, 33→230`。族 271 使用 `27101..27110`；族 231 虽有 `23100..23111` 十二张资源，但 icon 25 组只有十个，因此只使用 `23100..23109`。该映射来自已提供的左右资源图人工对应关系，不冒充原服务器官方映射。\n''', encoding='utf-8')

          readme = root / 'references' / 'battle-weapon-appearance-audit' / 'README.md'
          readme_text = readme.read_text(encoding='utf-8')
          old = '''## UNKNOWN\n\nicon group `21..33` 到 battle `weapon_code` 的**完整映射仍未恢复**。\n\n本目录两张 contact sheet 只是各自按组/族罗列实际图片，**禁止**按行号或视觉相似做左右配对。\n'''
          new = '''## COMPATIBILITY VISUAL MAPPING\n\n根据本目录两张 contact sheet 的人工外观核对，兼容服采用以下 icon group → battle weapon family 映射：\n\n```text\n21 -> 220\n22 -> 260\n23 -> 271\n24 -> 250\n25 -> 231\n26 -> 280\n27 -> 242\n28 -> 240\n29 -> 241\n30 -> 221\n31 -> 290\n32 -> 270\n33 -> 230\n```\n\n这是用户确认的**视觉兼容映射**，用于让装备图标与战斗武器外观对齐；不是从原服务器配置中恢复出的官方映射。代码以 `item_registry.WEAPON_ICON_GROUP_TO_BATTLE_FAMILY` 为单一真源。每个 icon group 的 0..9 列对应该 battle family 的前十个实际 image；族 271 特殊为 `27101..27110`，族 231 仅取 `23100..23109`，额外的 `23110/23111` 不映射。\n'''
          if old in readme_text:
              readme_text = readme_text.replace(old, new, 1)
          elif 'COMPATIBILITY VISUAL MAPPING' not in readme_text:
              raise SystemExit('battle audit README UNKNOWN section not found')
          readme.write_text(readme_text, encoding='utf-8')
          PY

      - name: Run weapon mapping regression
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -p 'test_weapon_appearance_consistency.py' -v

      - name: Run item registry regression
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -p 'test_item_registry.py' -v

      - name: Run affected battle actor regressions
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -p 'test_protocol.py' -k battle_actor -v

      - name: Commit verified mapping and remove temporary workflows
        shell: bash
        run: |
          git config user.name "Chenkai"
          git config user.email "58809786+M-C-Kai@users.noreply.github.com"
          rm -f .github/workflows/unify-weapon-battle-mapping.yml
          rm -f .github/workflows/unify-weapon-battle-mapping-v2.yml
          git add implementation_staging/item_registry.py implementation_staging/server.py implementation_staging/tests/test_weapon_appearance_consistency.py implementation_staging/PROTOCOL_LOCK.md implementation_staging/references/battle-weapon-appearance-audit/README.md .github/workflows/unify-weapon-battle-mapping.yml .github/workflows/unify-weapon-battle-mapping-v2.yml
          git commit -m "fix: align battle weapons with equipment icons"
          git push origin master
