name: temp-consignment-system
on:
  push:
    branches: [ feat/consignment-system ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run consignment tests
        working-directory: implementation_staging
        run: |
          python -m py_compile consignment_protocol.py consignment_service.py server.py
          python -m unittest tests.test_consignment_protocol tests.test_consignment_service tests.test_consignment_server
