name: temp-consignment-reverse
on:
  push:
    branches: [ feat/consignment-system ]

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover 2.0.0 APK URL
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          urls = [
              'https://www.yoyou.com/shouji/piaomiaosanjieshou_36512.html',
              'https://www.1ting.com/youxi/207465.html',
          ]
          for url in urls:
              print('PAGE', url)
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  html = urllib.request.urlopen(req, timeout=20).read().decode('utf-8','ignore')
              except Exception as exc:
                  print('ERR', type(exc).__name__, exc)
                  continue
              print('LEN', len(html))
              candidates = sorted(set(re.findall(r'https?://[^\"\'<> ]+?\.apk(?:\?[^\"\'<> ]*)?', html, re.I)))
              for candidate in candidates:
                  print('APKURL', candidate)
              for match in re.finditer(r'<a[^>]+href=[\"\']([^\"\']+)[\"\'][^>]*>(.*?)</a>', html, re.I|re.S):
                  href, text = match.groups()
                  text = re.sub('<.*?>','',text).strip()
                  if '下载' in text or '.apk' in href.lower():
                      print('LINK', text[:40], href)
          PY
