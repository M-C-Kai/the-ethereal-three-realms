name: temp-consignment-reverse
on:
  push:
    branches: [ feat/consignment-system ]

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect 1ting download resolver
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.1ting.com/youxi/207465.html'}
          for url in [
              'https://www.1ting.com/public/js/download.js',
              'https://www.1ting.com/youxi/207465.html',
          ]:
              print('\n===== FETCH', url, '=====')
              req=urllib.request.Request(url,headers=headers)
              data=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
              print(data[:30000])
              print('\n===== URL CANDIDATES =====')
              for x in sorted(set(re.findall(r'(?:https?:)?//[^\"\'<>\\ ]+',data))):
                  print(x)
          PY
