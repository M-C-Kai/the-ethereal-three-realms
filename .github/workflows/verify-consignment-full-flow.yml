name: verify-consignment-full-flow

on:
  push:
    branches: [feat/consignment-full-flow-20260912]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: RED or GREEN consignment verification
        working-directory: implementation_staging
        shell: bash
        run: |
          if [ ! -f consignment_service.py ]; then
            set +e
            python -m unittest tests.test_consignment_protocol tests.test_consignment_service -v > /tmp/red.log 2>&1
            status=$?
            set -e
            cat /tmp/red.log
            if [ "$status" -eq 0 ]; then
              echo 'Expected full-flow contract to fail before implementation.'
              exit 1
            fi
            grep -Eq 'full_native_request_api_exists|service_module_exists|FAILED|FAIL:' /tmp/red.log
            echo 'RED confirmed.'
            exit 0
          fi

          python -m py_compile consignment_protocol.py consignment_service.py server.py server_dynamic_maps.py
          python -m unittest \
            tests.test_consignment_protocol \
            tests.test_consignment_service \
            tests.test_consignment_entry \
            tests.test_consignment_categories -v
          python -m unittest discover -s tests -v
