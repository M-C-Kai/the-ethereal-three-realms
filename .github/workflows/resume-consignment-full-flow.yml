name: resume-consignment-full-flow

on:
  push:
    branches: [feat/consignment-full-flow-20260912]
    paths:
      - '.github/workflows/resume-consignment-full-flow.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reuse validated server patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-consignment-full-flow.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          Path('/tmp/apply_consignment_server.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_consignment_server.py

      - name: Verify complete consignment flow
        working-directory: implementation_staging
        run: |
          python -m py_compile consignment_protocol.py consignment_service.py server.py server_dynamic_maps.py
          python -m unittest \
            tests.test_consignment_protocol \
            tests.test_consignment_service \
            tests.test_consignment_server_contract \
            tests.test_consignment_category_entry \
            tests.test_consignment_entry \
            tests.test_consignment_categories -v

      - name: Prove no regression beyond repository baseline
        working-directory: implementation_staging
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/post.log 2>&1
          status=$?
          set -e
          cat /tmp/post.log
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('/tmp/post.log').read_text(encoding='utf-8', errors='replace')
          post = set(re.findall(r'^(?:FAIL|ERROR):\s+([^\n]+)', text, re.M))
          expected = {
              'test_1403_available_list_uses_task_runtime (test_task_server_integration.TaskServerIntegrationTests.test_1403_available_list_uses_task_runtime)',
              'test_1403_list_requests_return_native_snapshots (test_task_runtime.TaskRuntimeTests.test_1403_list_requests_return_native_snapshots)',
              'test_30_item_icons_align_to_property2_1_through_30 (test_armor_icon_alignment.ArmorIconAlignmentTests.test_30_item_icons_align_to_property2_1_through_30)',
              'test_additional_created_role_starts_with_320_slot_bag (test_inventory.InventoryCapacityTests.test_additional_created_role_starts_with_320_slot_bag)',
              'test_battle_image_response_falls_back_to_original_jar (test_protocol.ProtocolTests.test_battle_image_response_falls_back_to_original_jar)',
              'test_battle_image_response_uses_1501_and_role_cache (test_protocol.ProtocolTests.test_battle_image_response_uses_1501_and_role_cache)',
              'test_battle_resource_resolution_does_not_change_1502_payloads (test_protocol.ProtocolTests.test_battle_resource_resolution_does_not_change_1502_payloads)',
              'test_battle_resource_response_is_two_chunk_1503 (test_protocol.ProtocolTests.test_battle_resource_response_is_two_chunk_1503)',
              'test_battle_rewards_persist_experience_and_drop (test_protocol.ProtocolTests.test_battle_rewards_persist_experience_and_drop)',
              'test_boss_green_ring_effect_actor_uses_dedicated_dat (test_npc_spawn.NpcSpawnTests.test_boss_green_ring_effect_actor_uses_dedicated_dat)',
              'test_config_is_npc_baseline (test_npc_spawn.NpcSpawnTests.test_config_is_npc_baseline)',
              'test_equipping_preview_armor_changes_property15 (test_inventory.EquipmentResourcePreviewGrantTests.test_equipping_preview_armor_changes_property15)',
              'test_final_apk_contains_drawable_kunlun_map_resources (test_apk_map_resources.ApkMapResourceTests.test_final_apk_contains_drawable_kunlun_map_resources)',
              'test_full_bag_skips_new_battle_drop_but_keeps_experience_reward (test_inventory.InventoryCapacityTests.test_full_bag_skips_new_battle_drop_but_keeps_experience_reward)',
              'test_item_records_match_original_client_layout (test_protocol.ProtocolTests.test_item_records_match_original_client_layout)',
              'test_legacy_role_gains_persisted_320_slot_bag_without_losing_items (test_inventory.InventoryCapacityTests.test_legacy_role_gains_persisted_320_slot_bag_without_losing_items)',
              'test_legacy_role_receives_and_persists_all_three_currencies (test_currency.CurrencyTests.test_legacy_role_receives_and_persists_all_three_currencies)',
              'test_legacy_starter_items_migrate_to_complete_set (test_protocol.ProtocolTests.test_legacy_starter_items_migrate_to_complete_set)',
              'test_map_enter_frames_includes_npc_frames_on_map_58 (test_npc_spawn.NpcSpawnTests.test_map_enter_frames_includes_npc_frames_on_map_58)',
              'test_map_npc_frames_only_on_map_58 (test_npc_spawn.NpcSpawnTests.test_map_npc_frames_only_on_map_58)',
              'test_map_player_appearance_debug_matches_1006_without_changing_it (test_protocol.ProtocolTests.test_map_player_appearance_debug_matches_1006_without_changing_it)',
              'test_new_role_player_info_reports_320_bag_slots (test_inventory.InventoryCapacityTests.test_new_role_player_info_reports_320_bag_slots)',
              'test_npc_actor_spawns_only_on_map_58 (test_protocol.ProtocolTests.test_npc_actor_spawns_only_on_map_58)',
              'test_npc_catalog_supplements_models_without_touching_config (test_npc_spawn.NpcSpawnTests.test_npc_catalog_supplements_models_without_touching_config)',
              'test_player_and_world (test_protocol.ProtocolTests.test_player_and_world)',
              'test_preview_grant_is_idempotent_and_uses_unique_instance_ids (test_inventory.EquipmentResourcePreviewGrantTests.test_preview_grant_is_idempotent_and_uses_unique_instance_ids)',
              'test_preview_uses_distinct_real_icons_and_never_grants_14000 (test_armor_icon_alignment.ArmorIconAlignmentTests.test_preview_uses_distinct_real_icons_and_never_grants_14000)',
              'test_role_list_uses_apk_appearance_contract_not_role_stats (test_character_equipment_refresh.CharacterEquipmentRefreshTests.test_role_list_uses_apk_appearance_contract_not_role_stats)',
              'test_role_store_create_delete_and_persist (test_protocol.ProtocolTests.test_role_store_create_delete_and_persist)',
              'test_streamed_ref_enters_transition_before_parsing_new_ref (test_dynamic_map_ref_transfer.DynamicMapRefTransferTests.test_streamed_ref_enters_transition_before_parsing_new_ref)',
              'test_unequipping_preview_restores_base_or_remaining_equipped (test_inventory.EquipmentResourcePreviewGrantTests.test_unequipping_preview_restores_base_or_remaining_equipped)',
          }
          print('POST failures/errors:', len(post))
          print('Expected baseline-only failures/errors:', len(expected))
          new = sorted(post - expected)
          missing = sorted(expected - post)
          if new:
              print('NEW REGRESSIONS:')
              print('\n'.join(new))
          if missing:
              print('BASELINE DIFFERENCES:')
              print('\n'.join(missing))
          if post != expected:
              raise SystemExit('post-patch failure set differs from exact baseline-minus-consignment set')
          if any('consignment' in name.lower() for name in post):
              raise SystemExit('consignment test remains red')
          print('Exact baseline comparison passed: 31 unrelated pre-existing failures/errors only.')
          PY
          test "$status" -ne 0

      - name: Commit verified server integration and clean temporary machinery
        shell: bash
        run: |
          rm -f .github/workflows/apply-consignment-full-flow.yml
          rm -f .github/workflows/baseline-consignment-regression.yml
          rm -f .github/workflows/verify-consignment-full-flow.yml
          rm -f .github/workflows/resume-consignment-full-flow.yml
          rm -f .github/consignment-* .github/red-* .github/ZZZ-delete-me.txt .github/final-red-marker-delete.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add implementation_staging/server.py .github
          git commit -m 'feat: integrate complete consignment server flow [GREEN]'
          git push
