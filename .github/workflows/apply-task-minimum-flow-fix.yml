name: apply-task-minimum-flow-fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-task-minimum-flow-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply native task minimum-flow server patch
        working-directory: implementation_staging
        run: python tools/apply_task_minimum_flow_fix.py
      - name: Verify task regressions
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -p 'test_task_*.py' -v
      - name: Verify full unit suite
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -v
      - name: Commit server integration
        run: |
          if git diff --quiet -- implementation_staging/server.py; then
            echo 'server.py already contains native task minimum-flow fix'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add implementation_staging/server.py
          git commit -m 'fix(tasks): accept native action8 and allow NPC pathfinding'
          git pull --rebase origin master
          git push origin HEAD:master
