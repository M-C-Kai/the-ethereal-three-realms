name: verify-consignment-bootstrap

on:
  push:
    branches: [fix/consignment-bootstrap-categories]
    paths:
      - 'implementation_staging/consignment_protocol.py'
      - 'implementation_staging/server_dynamic_maps.py'
      - 'implementation_staging/tests/test_consignment_entry.py'
      - 'implementation_staging/tests/test_consignment_categories.py'
      - '.github/workflows/verify-consignment-bootstrap.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify consignment bootstrap
        working-directory: implementation_staging
        run: |
          python -m py_compile consignment_protocol.py server_dynamic_maps.py server.py
          python -m unittest tests.test_consignment_entry tests.test_consignment_categories -v
