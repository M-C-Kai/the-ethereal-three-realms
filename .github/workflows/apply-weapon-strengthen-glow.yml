name: Apply weapon strengthen glow mapping

on:
  push:
    paths:
      - '.github/workflows/apply-weapon-strengthen-glow.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Capture baseline suite
        shell: bash
        run: |
          cd implementation_staging
          set +e
          python -m unittest discover -s tests > /tmp/baseline.log 2>&1
          echo $? > /tmp/baseline.status
          set -e
          tail -n 40 /tmp/baseline.log || true

      - name: RED - prove current live weapon glow is wrong
        shell: bash
        run: |
          cat > implementation_staging/tests/test_weapon_strengthen_glow.py <<'PY'
          import unittest
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path(__file__).resolve().parents[1]))

          from item_registry import battle_weapon_image_from_icon
          from protocol import decode_frame, field_values
          from server import (
              Settings,
              battle_actor_frames,
              character_appearance,
              default_role,
              equipped_weapon_battle_field2,
              item_slot,
              role_items,
              role_list,
          )


          class WeaponStrengthenGlowTests(unittest.TestCase):
              def setUp(self):
                  self.settings = Settings()
                  self.role = default_role(self.settings)
                  self.weapon = next(
                      item for item in role_items(self.role)
                      if item_slot(item, self.settings.item_registry) == 10
                  )
                  self.weapon['location'] = 'equipped'
                  resolved = self.settings.item_registry.resolve(self.weapon)
                  self.icon_code = int(resolved['icon_code'])
                  self.weapon_image = battle_weapon_image_from_icon(self.icon_code)
                  self.assertGreater(self.weapon_image, 0)

              def expected_code(self, strengthen_level):
                  selector = 0 if strengthen_level < 4 else strengthen_level - 3
                  return self.weapon_image * 10 + selector

              def test_map_and_battle_use_strengthen_level_4_to_9_for_six_glow_stages(self):
                  for level in range(10):
                      with self.subTest(level=level):
                          self.weapon['strengthen_level'] = level
                          expected = self.expected_code(level)
                          self.assertEqual(
                              character_appearance(self.role, self.settings.item_registry)[7],
                              expected,
                          )
                          self.assertEqual(
                              equipped_weapon_battle_field2(self.role, self.settings.item_registry),
                              expected,
                          )
                          _, fields = decode_frame(battle_actor_frames(self.role, self.settings)[0])
                          self.assertEqual(field_values(fields)[2], expected)

              def test_login_1080_uses_same_strengthening_glow_selector(self):
                  for level in (0, 3, 4, 5, 8, 9):
                      with self.subTest(level=level):
                          self.weapon['strengthen_level'] = level
                          _, fields = decode_frame(role_list(self.settings, [self.role]))
                          values = field_values(fields)
                          record = values[2:17]
                          self.assertEqual(record[2], self.expected_code(level))

              def test_template_quality_no_longer_forces_live_glow_at_plus_zero(self):
                  resolved = self.settings.item_registry.resolve(self.weapon)
                  self.assertGreater(int(resolved.get('quality', 0)), 0)
                  self.weapon['strengthen_level'] = 0
                  expected = self.weapon_image * 10
                  self.assertEqual(
                      character_appearance(self.role, self.settings.item_registry)[7],
                      expected,
                  )
                  self.assertEqual(
                      equipped_weapon_battle_field2(self.role, self.settings.item_registry),
                      expected,
                  )


          if __name__ == '__main__':
              unittest.main()
          PY

          cd implementation_staging
          set +e
          python -m unittest tests.test_weapon_strengthen_glow > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'RED failed: old implementation unexpectedly satisfied the new behavior.'
            exit 1
          fi
          if ! grep -q 'FAIL:' /tmp/red.log; then
            echo 'RED failed for an unexpected reason; expected an assertion failure.'
            exit 1
          fi

      - name: Apply minimal production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          registry_path = Path('implementation_staging/item_registry.py')
          text = registry_path.read_text(encoding='utf-8')
          needle = '''def battle_weapon_field2_from_icon(icon_code: int, quality: int) -> int:\n    \"\"\"Build APK 1048 field[2]: battle image * 10 + quality selector.\"\"\"\n    image_id = battle_weapon_image_from_icon(icon_code)\n    quality_value = int(quality)\n    if image_id == 0 or not 0 <= quality_value <= 9:\n        return 0\n    return image_id * 10 + quality_value\n'''
          replacement = needle + '''\n\ndef weapon_effect_selector_from_strengthen_level(strengthen_level: int) -> int:\n    \"\"\"Map server strengthening +0..+9 to the APK weapon effect selector.\n\n    Confirmed compatibility rule for this project: +0..+3 have no external\n    weapon effect; +4..+9 select the six bundled effect stages 1..6.\n    \"\"\"\n    try:\n        level = int(strengthen_level)\n    except (TypeError, ValueError):\n        return 0\n    if not 0 <= level <= 9:\n        return 0\n    return 0 if level < 4 else level - 3\n\n\ndef weapon_appearance_field_from_icon_and_strengthen(\n    icon_code: int,\n    strengthen_level: int,\n) -> int:\n    \"\"\"Build live map/battle weapon code from body image and strengthen glow.\"\"\"\n    image_id = battle_weapon_image_from_icon(icon_code)\n    if image_id == 0:\n        return 0\n    return image_id * 10 + weapon_effect_selector_from_strengthen_level(strengthen_level)\n'''
          if text.count(needle) != 1:
              raise SystemExit('item_registry weapon encoder anchor changed')
          registry_path.write_text(text.replace(needle, replacement), encoding='utf-8')

          server_path = Path('implementation_staging/server.py')
          text = server_path.read_text(encoding='utf-8')
          old_import = '    battle_weapon_field2_from_icon,\n'
          new_import = '    weapon_appearance_field_from_icon_and_strengthen,\n'
          if text.count(old_import) != 1:
              raise SystemExit('server weapon import anchor changed')
          text = text.replace(old_import, new_import, 1)

          armor_anchor = '''            if armor_value is not None:\n                properties[2] = int(armor_value)\n        appearance = resolved.get('appearance_properties', {})\n'''
          armor_replacement = '''            if armor_value is not None:\n                properties[2] = int(armor_value)\n        if slot == 10:\n            # 武器主体来自 icon 映射；外部炫光只由实例强化等级控制。\n            # +0..+3 无炫光，+4..+9 对应 APK 六档效果 1..6。\n            properties[7] = weapon_appearance_field_from_icon_and_strengthen(\n                int(resolved.get('icon_code', 0)),\n                normalized_strengthen_level(resolved),\n            )\n        appearance = resolved.get('appearance_properties', {})\n'''
          if text.count(armor_anchor) != 1:
              raise SystemExit('character_appearance armor anchor changed')
          text = text.replace(armor_anchor, armor_replacement, 1)

          loop_anchor = '''            if slot == 3 and index in {2, 15}:\n                # 旧铠甲 property15 以及模板内硬编码 property2 都不得覆盖资料库。\n                continue\n            if index in BASE_CHARACTER_APPEARANCE:\n'''
          loop_replacement = '''            if slot == 3 and index in {2, 15}:\n                # 旧铠甲 property15 以及模板内硬编码 property2 都不得覆盖资料库。\n                continue\n            if slot == 10 and index == 7:\n                # 模板中的静态 quality 外观不得覆盖实例强化等级生成的武器效果。\n                continue\n            if index in BASE_CHARACTER_APPEARANCE:\n'''
          if text.count(loop_anchor) != 1:
              raise SystemExit('character_appearance overlay anchor changed')
          text = text.replace(loop_anchor, loop_replacement, 1)

          battle_anchor = '''    return battle_weapon_field2_from_icon(\n        int(resolved.get('icon_code', 0)),\n        int(resolved.get('quality', 0)),\n    )\n'''
          battle_replacement = '''    return weapon_appearance_field_from_icon_and_strengthen(\n        int(resolved.get('icon_code', 0)),\n        normalized_strengthen_level(resolved),\n    )\n'''
          if text.count(battle_anchor) != 1:
              raise SystemExit('equipped weapon battle encoder anchor changed')
          server_path.write_text(text.replace(battle_anchor, battle_replacement, 1), encoding='utf-8')

          test_path = Path('implementation_staging/tests/test_weapon_appearance_consistency.py')
          text = test_path.read_text(encoding='utf-8')
          replacements = {
              '        self.assertEqual(map_code, 242011)\n': '        self.assertEqual(map_code, 242010)\n',
              '        self.assertEqual(map_code, 270001)\n': '        self.assertEqual(map_code, 270000)\n',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'weapon consistency expectation anchor changed: {old.strip()}')
              text = text.replace(old, new, 1)
          test_path.write_text(text, encoding='utf-8')

          inventory_test = Path('implementation_staging/tests/test_inventory.py')
          text = inventory_test.read_text(encoding='utf-8')
          replacements = {
              "        self.assertEqual(after[7], definition.appearance_properties['7'])\n": "        self.assertEqual(after[7], (definition.appearance_properties['7'] // 10) * 10)\n",
              "        self.assertEqual(equipped[7], second.appearance_properties['7'])\n": "        self.assertEqual(equipped[7], (second.appearance_properties['7'] // 10) * 10)\n",
              "        self.assertEqual(after_one[7], first.appearance_properties['7'])\n": "        self.assertEqual(after_one[7], (first.appearance_properties['7'] // 10) * 10)\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'inventory weapon expectation anchor changed: {old.strip()}')
              text = text.replace(old, new, 1)
          inventory_test.write_text(text, encoding='utf-8')
          PY

      - name: GREEN - targeted refresh and strengthening regression
        shell: bash
        run: |
          cd implementation_staging
          python -m unittest \
            tests.test_weapon_strengthen_glow \
            tests.test_weapon_appearance_consistency \
            tests.test_character_equipment_refresh \
            tests.test_character_update_bus \
            tests.test_strengthening \
            tests.test_inventory.EquipmentResourcePreviewGrantTests.test_equipping_preview_weapon_changes_property7 \
            tests.test_inventory.EquipmentResourcePreviewGrantTests.test_unequipping_preview_weapon_restores_property7

      - name: Verify no new full-suite failures
        shell: bash
        run: |
          cd implementation_staging
          set +e
          python -m unittest discover -s tests > /tmp/after.log 2>&1
          echo $? > /tmp/after.status
          set -e
          tail -n 40 /tmp/after.log || true
          python - <<'PY'
          import re
          from pathlib import Path

          def problems(path):
              text = Path(path).read_text(encoding='utf-8', errors='replace')
              return set(re.findall(r'^(?:FAIL|ERROR): ([^\n]+)', text, flags=re.M))

          before = problems('/tmp/baseline.log')
          after = problems('/tmp/after.log')
          new = sorted(after - before)
          print('baseline problems:', len(before))
          print('after problems:', len(after))
          print('new problems:', new)
          if new:
              raise SystemExit('new full-suite failures introduced')
          PY

      - name: Commit production change and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-weapon-strengthen-glow.yml
          git add implementation_staging/item_registry.py \
                  implementation_staging/server.py \
                  implementation_staging/tests/test_weapon_appearance_consistency.py \
                  implementation_staging/tests/test_weapon_strengthen_glow.py \
                  implementation_staging/tests/test_inventory.py
          git commit -m 'fix: drive weapon glow from strengthening'
          git push origin HEAD:master
