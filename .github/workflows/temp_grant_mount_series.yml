name: Apply mount series grant integration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp_grant_mount_series.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Patch mount series grants
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('implementation_staging/server.py')
          text = path.read_text(encoding='utf-8')

          old_import = '''from mount_constructor import (\n    mount_ride_code_for_role,\n    mount_ride_code_from_item,\n)'''
          new_import = '''from mount_constructor import (\n    construct_mount_state,\n    create_mount_item_instance,\n    load_mount_catalog,\n    mount_ride_code_for_role,\n    mount_ride_code_from_item,\n)'''
          if old_import not in text:
              raise SystemExit('mount_constructor import block not found')
          text = text.replace(old_import, new_import, 1)

          marker = '\ndef clear_role_bag_once(role: dict[str, object]) -> bool:\n'
          helper = '''\ndef ensure_all_mount_series_items(\n    role: dict[str, object],\n    item_registry: ItemRegistry,\n) -> bool:\n    \"\"\"Ensure the role owns one real bag item for every known mount series.\n\n    This is intentionally idempotent. Existing mount instances are resolved\n    through the constructor (including legacy appearance-projection items),\n    so reconnecting never duplicates a series the role already owns. New\n    grants are normal item instances with authoritative per-instance\n    ``mount_state`` and start at the normal logical stage in the bag.\n    \"\"\"\n    catalog = load_mount_catalog()\n    items = role_items(role)\n    owned_series: set[int] = set()\n    for item in items:\n        if not isinstance(item, dict):\n            continue\n        try:\n            state = construct_mount_state(item, item_registry, catalog)\n        except (KeyError, TypeError, ValueError):\n            continue\n        if state is not None:\n            owned_series.add(int(state.series_id))\n\n    changed = False\n    for series_id in sorted(catalog.series):\n        if series_id in owned_series:\n            continue\n        items.append(create_mount_item_instance(\n            instance_id=allocate_item_instance_id(role),\n            series_id=series_id,\n            stage=0,\n            grade=1,\n            growth=0,\n            location='bag',\n            catalog=catalog,\n        ))\n        owned_series.add(series_id)\n        changed = True\n    return changed\n\n\n'''
          if marker not in text:
              raise SystemExit('clear_role_bag_once marker not found')
          text = text.replace(marker, helper + marker, 1)

          old_new_items = '''            ensure_equipment_resource_preview_items(role, registry)\n            return True'''
          new_new_items = '''            ensure_equipment_resource_preview_items(role, registry)\n            ensure_all_mount_series_items(role, registry)\n            return True'''
          if old_new_items not in text:
              raise SystemExit('new-item initialization block not found')
          text = text.replace(old_new_items, new_new_items, 1)

          old_tail = '''        changed = ensure_equipment_resource_preview_items(role, registry) or changed\n        for item in items:'''
          new_tail = '''        changed = ensure_equipment_resource_preview_items(role, registry) or changed\n        changed = ensure_all_mount_series_items(role, registry) or changed\n        for item in items:'''
          if old_tail not in text:
              raise SystemExit('_ensure_items tail not found')
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Add focused tests
        run: |
          cat > implementation_staging/tests/test_mount_series_grant.py <<'PY'
          import unittest

          from item_registry import default_item_registry
          from mount_constructor import construct_mount_state, load_mount_catalog
          from server import ensure_all_mount_series_items


          class MountSeriesGrantTests(unittest.TestCase):
              def test_grants_one_item_for_every_series_and_is_idempotent(self):
                  registry = default_item_registry()
                  catalog = load_mount_catalog()
                  role = {'id': 77, 'items': []}

                  self.assertTrue(ensure_all_mount_series_items(role, registry))
                  states = [construct_mount_state(item, registry, catalog) for item in role['items']]
                  self.assertEqual(len(states), len(catalog.series))
                  self.assertEqual({state.series_id for state in states}, set(catalog.series))
                  self.assertTrue(all(state.stage == 0 for state in states))
                  self.assertTrue(all(item['location'] == 'bag' for item in role['items']))
                  self.assertEqual(len({item['id'] for item in role['items']}), len(role['items']))

                  before = list(role['items'])
                  self.assertFalse(ensure_all_mount_series_items(role, registry))
                  self.assertEqual(role['items'], before)

              def test_existing_series_is_not_duplicated(self):
                  registry = default_item_registry()
                  catalog = load_mount_catalog()
                  role = {
                      'id': 78,
                      'items': [{
                          'id': 780000,
                          'template_id': catalog.template_id_for_image(41002),
                          'quantity': 1,
                          'location': 'bag',
                          'mount_state': {
                              'series_id': 41002,
                              'stage': 2,
                              'grade': 9,
                              'growth': 5,
                          },
                      }],
                  }
                  self.assertTrue(ensure_all_mount_series_items(role, registry))
                  series_41002 = [
                      item for item in role['items']
                      if item.get('mount_state', {}).get('series_id') == 41002
                  ]
                  self.assertEqual(len(series_41002), 1)
                  self.assertEqual(series_41002[0]['mount_state']['stage'], 2)


          if __name__ == '__main__':
              unittest.main()
          PY
      - name: Verify
        working-directory: implementation_staging
        run: |
          python -m py_compile mount_constructor.py item_registry.py server.py
          python -m unittest tests.test_mount_constructor tests.test_mount_series_grant
      - name: Commit integration and remove temporary workflow
        run: |
          rm .github/workflows/temp_grant_mount_series.yml
          git config user.name 'M-C-Kai'
          git config user.email '58809786+M-C-Kai@users.noreply.github.com'
          git add implementation_staging/server.py implementation_staging/tests/test_mount_series_grant.py .github/workflows/temp_grant_mount_series.yml
          git commit -m 'feat: grant one mount item per series to roles'
          git push origin HEAD:master
