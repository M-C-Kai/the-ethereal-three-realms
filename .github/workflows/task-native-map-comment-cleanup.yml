name: task-native-map-comment-cleanup

on:
  push:
    branches: ['fix/task-native-map-id']
    paths:
      - '.github/workflows/task-native-map-comment-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/task-native-map-id
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correct 1110 protocol comment
        working-directory: implementation_staging
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.py')
          s = p.read_text(encoding='utf-8')
          old = "    # 1110 field 1/2 are the logical map id used by the client. The patched\n    # APK carries the matching 50000.map.ref alias for the target map.\n"
          new = "    # APK main/e stores 1110 as logical map id (field 0), resource map id\n    # (field 1), map flags (field 2), and map name (field 3). Task screens\n    # compare m.q() (field 0) to route map id before same-map local pathing.\n"
          if old not in s:
              raise SystemExit('stale 1110 comment not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify task suite
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -p 'test_task_*.py' -v
      - name: Commit comment cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add implementation_staging/server.py
          git commit -m 'docs(protocol): correct 1110 native field semantics'
          git push origin HEAD:fix/task-native-map-id
