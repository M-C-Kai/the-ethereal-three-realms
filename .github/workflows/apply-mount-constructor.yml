name: Apply mount constructor integration

on:
  push:
    branches: [feat/mount-constructor]
    paths:
      - '.github/workflows/apply-mount-constructor.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mount-constructor
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch runtime integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # item_registry: the old 54-entry deprecation list was a temporary
          # cleanup mechanism.  The one-time bag reset now owns that migration,
          # so future real mount instances must not be deleted on every login.
          path = Path('implementation_staging/item_registry.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"@lru_cache\(maxsize=1\)\ndef deprecated_mount_template_ids\(\) -> frozenset\[int\]:\n"
              r".*?\n    return frozenset\(template_ids\)\n",
              re.S,
          )
          replacement = '''@lru_cache(maxsize=1)
          def deprecated_mount_template_ids() -> frozenset[int]:
              """Return only explicitly deprecated mount templates.

              The earlier 54-template blanket removal was only for cleaning the
              accidentally granted starter atlas.  Legacy bags are now handled by
              the one-time role-bag migration, so real acquired mount instances
              must survive future logins.
              """
              data = json.loads(MOUNT_APPEARANCE_MAPPING_FILE.read_text(encoding='utf-8'))
              raw = data.get('deprecated_template_ids', [])
              if not isinstance(raw, list):
                  raise ValueError('mount deprecated_template_ids must be a list')
              return frozenset(int(value) for value in raw)
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'failed to replace deprecated_mount_template_ids: {count}')
          path.write_text(text, encoding='utf-8')

          # server: derive property 22 from the equipped mount item instance.
          path = Path('implementation_staging/server.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''from mount_protocol import (
              is_mount_atlas_request,
              load_mount_atlas_entries,
              mount_atlas_frame,
          )
          '''
          if anchor not in text:
              raise SystemExit('mount_protocol import anchor not found')
          replacement = anchor + '''from mount_constructor import (
              mount_ride_code_for_role,
              mount_ride_code_from_item,
          )
          '''
          text = text.replace(anchor, replacement, 1)

          old = "    properties[22] = integer(int(role.get('mount_model', 0)))\n"
          new = "    properties[22] = integer(mount_ride_code_for_role(role, settings.item_registry))\n"
          if old not in text:
              raise SystemExit('property22 anchor not found')
          text = text.replace(old, new, 1)

          old = "                        mount_model = resolved_item.get('mount_model')\n"
          occurrences = text.count(old)
          if occurrences < 3:
              raise SystemExit(f'expected >=3 mount_model item reads, got {occurrences}')
          text = text.replace(
              old,
              "                        mount_model = mount_ride_code_from_item(item, self.settings.item_registry)\n",
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add constructor regression tests
        shell: bash
        run: |
          cat > implementation_staging/tests/test_mount_constructor.py <<'PY'
          import unittest

          from item_registry import default_item_registry, deprecated_mount_template_ids
          from mount_constructor import (
              MOUNT_STAGE_DIVINE,
              MOUNT_STAGE_IMMORTAL,
              MOUNT_STAGE_NORMAL,
              MOUNT_STAGE_SPIRIT,
              construct_mount_state,
              create_mount_item_instance,
              mount_ride_code_for_role,
          )


          class MountConstructorTests(unittest.TestCase):
              def setUp(self):
                  self.registry = default_item_registry()

              def test_41010_four_stage_chain(self):
                  expected = [1010, 1020, 1030, 4010]
                  for stage, ride_code in enumerate(expected):
                      item = create_mount_item_instance(
                          instance_id=10000 + stage,
                          series_id=41010,
                          stage=stage,
                      )
                      state = construct_mount_state(item, self.registry)
                      self.assertIsNotNone(state)
                      self.assertEqual(state.ride_code, ride_code)

              def test_42004_reuses_normal_until_divine(self):
                  expected = {
                      MOUNT_STAGE_NORMAL: 2004,
                      MOUNT_STAGE_SPIRIT: 2004,
                      MOUNT_STAGE_IMMORTAL: 2004,
                      MOUNT_STAGE_DIVINE: 3002,
                  }
                  for stage, ride_code in expected.items():
                      item = create_mount_item_instance(
                          instance_id=11000 + stage,
                          series_id=42004,
                          stage=stage,
                      )
                      state = construct_mount_state(item, self.registry)
                      self.assertEqual(state.ride_code, ride_code)

              def test_same_series_can_exist_at_different_stages(self):
                  bag_mount = create_mount_item_instance(
                      instance_id=12001,
                      series_id=41004,
                      stage=MOUNT_STAGE_SPIRIT,
                      grade=8,
                      location='bag',
                  )
                  equipped_mount = create_mount_item_instance(
                      instance_id=12002,
                      series_id=41004,
                      stage=MOUNT_STAGE_DIVINE,
                      grade=18,
                      location='equipped',
                  )
                  bag_state = construct_mount_state(bag_mount, self.registry)
                  equipped_state = construct_mount_state(equipped_mount, self.registry)
                  self.assertEqual(bag_state.ride_code, 1014)
                  self.assertEqual(equipped_state.ride_code, 1034)
                  self.assertEqual(bag_state.grade, 8)
                  self.assertEqual(equipped_state.grade, 18)
                  role = {'id': 10001, 'items': [bag_mount, equipped_mount], 'mount_model': 0}
                  self.assertEqual(mount_ride_code_for_role(role, self.registry), 1034)

              def test_mount_is_a_real_bag_item_until_equipped(self):
                  item = create_mount_item_instance(instance_id=13001, series_id=41002)
                  self.assertEqual(item['location'], 'bag')
                  self.assertIn('mount_state', item)
                  item['location'] = 'equipped'
                  role = {'id': 10001, 'items': [item], 'mount_model': 0}
                  self.assertEqual(mount_ride_code_for_role(role, self.registry), 1002)

              def test_future_mount_items_are_not_permanently_deprecated(self):
                  self.assertEqual(deprecated_mount_template_ids(), frozenset())


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Verify constructor and mount regressions
        shell: bash
        run: |
          set -e
          cd implementation_staging
          python -m py_compile mount_constructor.py mount_protocol.py item_registry.py server.py
          python -m unittest tests.test_mount_constructor -v
          python -m unittest \
            tests.test_mount_catalog.MountCatalogTests.test_catalog_contains_54_unique_riding_appearances \
            tests.test_mount_catalog.MountCatalogTests.test_new_role_receives_no_mounts_by_default \
            tests.test_mount_catalog.MountCatalogTests.test_mount_atlas_entries_are_generated_from_resource_catalog \
            tests.test_mount_catalog.MountCatalogTests.test_mount_atlas_request_requires_byte_action_30 \
            tests.test_mount_catalog.MountCatalogTests.test_mount_atlas_frame_uses_protocol_1024_action_30 -v
          python -m unittest discover -s tests -p 'test_role_bag_reset.py' -v

      - name: Commit verified integration and remove executor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add implementation_staging/item_registry.py implementation_staging/server.py implementation_staging/tests/test_mount_constructor.py
          git rm .github/workflows/apply-mount-constructor.yml
          git commit -m 'feat: integrate mount constructor with equipment state'
          git push origin HEAD:feat/mount-constructor
