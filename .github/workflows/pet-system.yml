name: pet-system

on:
  push:
    branches: [master]
    paths:
      - 'implementation_staging/systems/pet/**'
      - 'implementation_staging/tests/test_pet_system.py'
      - '.github/workflows/pet-system.yml'
  pull_request:
    paths:
      - 'implementation_staging/systems/pet/**'
      - 'implementation_staging/tests/test_pet_system.py'

jobs:
  pet-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pet system tests
        working-directory: implementation_staging
        run: python -m unittest tests.test_pet_system -v
