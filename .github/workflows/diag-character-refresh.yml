name: Diagnose character refresh protocol

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/diag-character-refresh.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect character refresh protocol
        working-directory: implementation_staging
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          source = Path('server.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          wanted = {
              'role_list', 'player_info', 'character_panel_frames',
              'character_appearance', 'character_appearance_frame',
              'character_appearance_change_frame', 'equipment_panel_refresh_frame',
              'combat_stats', 'role_level_properties', 'equipped_weapon_attack',
              'strengthening_action_result',
          }
          print('=== SERVER FUNCTIONS ===')
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in wanted:
                  print(f'\n--- {node.name} ---')
                  print(ast.get_source_segment(source, node))

          print('\n=== SERVER MUTATION CONTEXT ===')
          for needle in [
              "elif (\n                        action == 5",
              "elif action == 6",
              "appearance_frame = character_appearance_change_frame",
              "StrengtheningActionResult(tuple(frames), True",
              "role_list(self.settings",
              "character_panel_frames(active_role)",
          ]:
              pos = source.find(needle)
              print(f'\n--- needle: {needle!r} pos={pos} ---')
              if pos >= 0:
                  print(source[max(0,pos-2200):pos+5200])

          smali = Path('references/smali/pmsj/work/main/e.smali').read_text(encoding='utf-8')
          def method(name):
              pat = re.compile(rf'\.method private static {re.escape(name)}\(Lpmsj/work/main/w;\)V.*?\.end method', re.S)
              m = pat.search(smali)
              print(f'\n=== SMALI METHOD {name} ===')
              print(m.group(0) if m else 'NOT FOUND')
          method('K')   # 1080 role list
          method('O')   # 1017 incremental properties
          method('ae')  # 1039 character panel data

          print('\n=== CLIENT 1080 SEND REFERENCES ===')
          candidates = [
              Path('references/smali/pmsj/work/main/k.smali'),
              Path('references/smali/pmsj/work/main/w.smali'),
              Path('references/smali/pmsj/work/e/af.smali'),
          ]
          for path in candidates:
              text = path.read_text(encoding='utf-8')
              hits = [m.start() for m in re.finditer(r'0x438', text)]
              if hits:
                  print(f'\n--- {path} hits={len(hits)} ---')
                  for pos in hits:
                      print(text[max(0,pos-1000):pos+1800])
          PY
