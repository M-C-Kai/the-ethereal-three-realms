name: temp-consignment-retry
on:
  push:
    branches: [ feat/item-consignment-market-integrated ]
permissions:
  contents: write
jobs:
  retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute corrected implementation workflow steps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/temp_consignment_implement.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "            tests.test_pet_protocol \\\n            tests.test_pet_registry",
              "            tests.test_pet_minimal_loop",
          )
          text = text.replace(
              "rm -f .github/workflows/temp_consignment_diag.yml .github/workflows/temp_consignment_implement.yml",
              "rm -f .github/workflows/temp_consignment_diag.yml .github/workflows/temp_consignment_implement.yml .github/workflows/temp_consignment_retry.yml",
          )
          text = text.replace(
              "                  .github/workflows/temp_consignment_implement.yml",
              "                  .github/workflows/temp_consignment_implement.yml \\\n                  .github/workflows/temp_consignment_retry.yml",
          )

          wanted = [
              'Write RED consignment tests',
              'Verify RED',
              'Implement protocol and service',
              'Patch server integration',
              'Verify GREEN',
              'Static integration assertions',
              'Commit integrated consignment implementation',
          ]
          lines = text.splitlines()
          runner = ['set -euo pipefail']
          for idx, name in enumerate(wanted):
              marker = f'      - name: {name}'
              try:
                  start = lines.index(marker)
              except ValueError:
                  raise SystemExit(f'missing workflow step: {name}')
              end = next(
                  (i for i in range(start + 1, len(lines)) if lines[i].startswith('      - name: ')),
                  len(lines),
              )
              section = lines[start:end]
              cwd = '.'
              for line in section:
                  if line.startswith('        working-directory: '):
                      cwd = line.split(': ', 1)[1].strip()
              try:
                  run_at = next(i for i, line in enumerate(section) if line == '        run: |')
              except StopIteration:
                  raise SystemExit(f'missing run block: {name}')
              script_lines = []
              for line in section[run_at + 1:]:
                  if line.startswith('          '):
                      script_lines.append(line[10:])
                  elif not line.strip():
                      script_lines.append('')
                  else:
                      break
              script = Path(f'/tmp/consignment_step_{idx}.sh')
              script.write_text('\n'.join(script_lines) + '\n', encoding='utf-8')
              runner += [f"echo '=== {name} ==='", f"(cd {cwd!r} && bash {str(script)!r})"]
          Path('/tmp/run_consignment_steps.sh').write_text('\n'.join(runner) + '\n', encoding='utf-8')
          PY
          bash /tmp/run_consignment_steps.sh
