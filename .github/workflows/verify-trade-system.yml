name: verify-trade-system

on:
  push:
    branches: [feat/consignment-full-flow-20260912]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run trade system contract
        working-directory: implementation_staging
        run: |
          python -m unittest \
            tests.test_trade_system \
            tests.test_trade_order_history -v
