name: Fix map weapon appearance mapping v3

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-map-weapon-appearance-v3.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Apply unified equipped weapon mapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('implementation_staging')

          # item_registry.py: property7 uses the same complete weapon code as battle field2.
          path = root / 'item_registry.py'
          text = path.read_text(encoding='utf-8')
          old = '''def preview_weapon_property7(
              icon_code: int,
              preview_index_in_slot: int,
              candidates: Sequence[dict[str, Any]],
          ) -> int:
              """Compatibility preview pairing for map-character property 7.

              low4 comes from APK-confirmed resource candidates.
              The high digits use icon_group = icon_code // 100 as local preview construction.
              This is not an official icon_code → property7 mapping.
              """
              if not candidates:
                  raise ItemCatalogError('weapon preview requires confirmed property7 candidates')
              candidate = candidates[int(preview_index_in_slot) % len(candidates)]
              icon_group = int(icon_code) // 100
              low4 = int(candidate['property7_low4_candidate'])
              return icon_group * 10_000 + low4
          '''
          new = '''def preview_weapon_property7(
              icon_code: int,
              quality: int = PREVIEW_QUALITY,
          ) -> int:
              """Return the complete map weapon code for character property 7.

              APK v.r() routes property 7 to v.e(I). v.e(I) decodes this value
              exactly like battle 1048 field[2]: value//10 is the weapon image
              and value%10 is the quality overlay selector.
              """
              value = battle_weapon_field2_from_icon(icon_code, quality)
              if value == 0:
                  raise ItemCatalogError(f'unknown weapon appearance icon_code={icon_code}')
              return value
          '''
          if old not in text:
              raise SystemExit('item_registry preview_weapon_property7 block not found')
          text = text.replace(old, new, 1)
          old_call = '''            '7': preview_weapon_property7(
                          icon_code,
                          preview_index_in_slot,
                          weapon_candidates or (),
                      )
          '''
          new_call = '''            '7': preview_weapon_property7(icon_code)
          '''
          if old_call not in text:
              raise SystemExit('item_registry property7 call block not found')
          text = text.replace(old_call, new_call, 1)
          path.write_text(text, encoding='utf-8')

          # Generator: remove the obsolete 69-candidate cycling input.
          path = root / 'tools' / 'build_equipment_resource_preview_items.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace('    confirmed_weapon_preview_candidates,\n', '')
          old_candidates_file = '''WEAPON_CANDIDATES_FILE = (
              ROOT / 'references' / 'weapon-appearance-audit' / 'property7_candidates.json'
          )
          '''
          if old_candidates_file not in text:
              raise SystemExit('generator WEAPON_CANDIDATES_FILE block not found')
          text = text.replace(old_candidates_file, '', 1)
          old_load = '''    weapon_candidates = confirmed_weapon_preview_candidates(
                  json.loads(WEAPON_CANDIDATES_FILE.read_text(encoding='utf-8'))
              )
              if not weapon_candidates:
                  raise SystemExit('no confirmed weapon appearance candidates')
          '''
          if old_load not in text:
              raise SystemExit('generator weapon candidate load block not found')
          text = text.replace(old_load, '', 1)
          text = text.replace('                weapon_candidates=weapon_candidates,\n', '', 1)
          old_note = '''                '武器 property7 低4位循环配对 weapon-appearance-audit 中 69 个 APK-confirmed 候选；'
                          '高位使用 icon_group=icon_code//100，仅为 compatibility preview pairing，'
                          '不是官方 icon_code→property7 映射。'
          '''
          new_note = '''                '武器 property7 使用用户按 APK 资源图确认的 icon group→weapon family 映射；'
                          '地图 property7 与战斗 1048 field[2] 共用完整编码 image*10+quality。'
          '''
          if old_note not in text:
              raise SystemExit('generator metadata weapon note not found')
          text = text.replace(old_note, new_note, 1)
          text = text.replace(
              "'appearance_pairing': 'compatibility_preview_pairing',",
              "'appearance_pairing': 'confirmed_visual_weapon_family_mapping',",
              1,
          )
          path.write_text(text, encoding='utf-8')

          # Starter weapon: icon 2701 -> family 242 -> image 24201 -> quality1 => 242011.
          path = root / 'data' / 'catalog' / 'items.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          starter = next(item for item in payload['items'] if int(item['template_id']) == 100001001)
          if int(starter['icon_code']) != 2701:
              raise SystemExit('starter weapon icon_code changed unexpectedly')
          starter.setdefault('appearance_properties', {})['7'] = 242011
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Correct protocol lock based on v.r(): property7->e(I), property22->G(I).
          path = root / 'PROTOCOL_LOCK.md'
          text = path.read_text(encoding='utf-8')
          marker = '\n\n## 战斗武器外观一致性\n'
          if marker not in text:
              raise SystemExit('PROTOCOL_LOCK old weapon section not found')
          prefix = text.split(marker, 1)[0]
          section = '''

          ## 地图/战斗武器外观统一

          APK `pmsj/work/b/v.r()` 明确执行 `property 7 -> v.e(I)`，而 `property 22 -> v.G(I)`。旧审计把 `H/I/G` 的 `40000` 路径归到 property7 是误判。

          `v.e(I)` 的地图武器编码规则为：`property7 / 10 = weapon image`、`property7 % 10 = quality`；品质非 0 时用 `property7 / 1000` 匹配固定 family 数组 `[241,220,290,231,280,250,270,271,242,240,260,221,230]`，品质覆盖 image 为 `30000 + family_index*100 + quality`。这与战斗 `1048 field[2]` 使用的完整武器编码一致。

          当前用户按 APK contact sheet 确认的 icon group→family 映射为：`21→220, 22→260, 23→271, 24→250, 25→231, 26→280, 27→242, 28→240, 29→241, 30→221, 31→290, 32→270, 33→230`。族 271 映射 `27101..27110`；族 231 只使用 `23100..23109`，额外 `23110/23111` 不自动分配。

          同一已装备武器必须满足：`character_appearance(role)[7] == 1048 field[2] == battle_weapon_field2_from_icon(icon_code, quality)`；卸下武器后均为 `0`。
          '''
          section = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines())
          path.write_text(prefix + section + '\n', encoding='utf-8')

          # Correct the historical 40000-series audit interpretation.
          path = root / 'references' / 'weapon-appearance-audit' / 'README.md'
          readme = '''# 武器外观资源审计（property7 误判修正）

          本目录保留 APK 中 `100000..110000` role DAT、`40000..49999` 图片 ID 与候选表作为历史审计资料，但这些候选**不再用于人物 property7 武器映射**。

          ## 已确认

          `pmsj/work/b/v.r()` 的真实调用关系：

          ```text
          property 7  -> v.e(I)
          property 22 -> v.G(I)
          ```

          `v.e(I)` 将 property7 解释为完整武器编码：`value//10` 为武器 image，`value%10` 为品质；使用的 family 数组为 `[241,220,290,231,280,250,270,271,242,240,260,221,230]`。因此地图 property7 与战斗 `1048 field[2]` 应使用同一个武器编码。

          旧版 `property7_candidates.json` 的 69 个候选来自 `H/I/G`/40000 系列资源反向审计，但把这条路径标成 property7 是错误解释。文件继续保留用于复核 APK 资源存在性，生产代码不得再将其循环分配给 slot10 武器。
          '''
          readme = '\n'.join(line[10:] if line.startswith('          ') else line for line in readme.splitlines()) + '\n'
          path.write_text(readme, encoding='utf-8')
          PY

      - name: Regenerate preview catalog
        working-directory: implementation_staging
        run: PYTHONPATH=. python tools/build_equipment_resource_preview_items.py

      - name: Write focused weapon regression
        shell: bash
        run: |
          cat > implementation_staging/tests/test_weapon_appearance_consistency.py <<'PY'
          import json
          import sys
          import unittest
          from pathlib import Path

          sys.path.insert(0, str(Path(__file__).resolve().parents[1]))

          from item_registry import (
              WEAPON_ICON_GROUP_TO_BATTLE_FAMILY,
              battle_weapon_field2_from_icon,
              battle_weapon_image_from_icon,
              default_item_registry,
          )
          from protocol import decode_frame, field_values
          from server import Settings, battle_actor_frames, character_appearance, equipped_weapon_battle_field2

          EXPECTED = {
              21: 220, 22: 260, 23: 271, 24: 250, 25: 231, 26: 280,
              27: 242, 28: 240, 29: 241, 30: 221, 31: 290, 32: 270, 33: 230,
          }

          class WeaponAppearanceConsistencyTests(unittest.TestCase):
              def test_confirmed_family_mapping(self):
                  self.assertEqual(WEAPON_ICON_GROUP_TO_BATTLE_FAMILY, EXPECTED)

              def test_all_130_preview_weapons_use_unified_code(self):
                  root = Path(__file__).resolve().parents[1]
                  preview = json.loads((root / 'data/catalog/equipment_resource_preview_items.json').read_text(encoding='utf-8'))
                  manifest = json.loads((root / 'references/battle-weapon-appearance-audit/manifest.json').read_text(encoding='utf-8'))
                  weapons = [x for x in preview['items'] if int(x.get('equipment_slot', 0)) == 10]
                  self.assertEqual(len(weapons), 130)
                  for item in weapons:
                      icon = int(item['icon_code'])
                      quality = int(item['quality'])
                      code = int(item['appearance_properties']['7'])
                      self.assertEqual(code, battle_weapon_field2_from_icon(icon, quality), icon)
                      family = EXPECTED[icon // 100]
                      images = [int(v) for v in manifest['battle_weapon_families'][str(family)]]
                      if family == 231:
                          images = images[:10]
                      self.assertIn(code // 10, images, icon)

              def test_special_rows(self):
                  self.assertEqual(battle_weapon_image_from_icon(2300), 27101)
                  self.assertEqual(battle_weapon_image_from_icon(2309), 27110)
                  self.assertEqual(battle_weapon_field2_from_icon(2509, 1), 231091)
                  self.assertEqual(battle_weapon_field2_from_icon(2701, 1), 242011)

              def test_starter_map_and_battle_match(self):
                  settings = Settings()
                  role = {'id': 10001, 'name': '测试角色', 'model': 19, 'items': [
                      {'id': 1, 'template_id': 100001001, 'quantity': 1, 'location': 'equipped'}
                  ]}
                  map_code = character_appearance(role, settings.item_registry)[7]
                  self.assertEqual(map_code, 242011)
                  self.assertEqual(equipped_weapon_battle_field2(role, settings.item_registry), map_code)
                  _, fields = decode_frame(battle_actor_frames(role, settings)[0])
                  self.assertEqual(field_values(fields)[2], map_code)

              def test_preview_map_and_battle_match(self):
                  root = Path(__file__).resolve().parents[1]
                  preview = json.loads((root / 'data/catalog/equipment_resource_preview_items.json').read_text(encoding='utf-8'))
                  item = next(x for x in preview['items'] if int(x.get('equipment_slot', 0)) == 10 and int(x['icon_code']) == 3200)
                  registry = default_item_registry()
                  role = {'id': 10001, 'name': '测试角色', 'model': 19, 'items': [
                      {'id': 1, 'template_id': int(item['template_id']), 'quantity': 1, 'location': 'equipped'}
                  ]}
                  map_code = character_appearance(role, registry)[7]
                  self.assertEqual(map_code, 270001)
                  self.assertEqual(equipped_weapon_battle_field2(role, registry), map_code)
                  _, fields = decode_frame(battle_actor_frames(role, Settings(item_registry=registry))[0])
                  self.assertEqual(field_values(fields)[2], map_code)

              def test_unequipped_is_zero(self):
                  registry = default_item_registry()
                  role = {'id': 10001, 'name': '测试角色', 'model': 19, 'items': []}
                  self.assertEqual(character_appearance(role, registry)[7], 0)
                  self.assertEqual(equipped_weapon_battle_field2(role, registry), 0)

          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Update item registry regression exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('implementation_staging/tests/test_item_registry.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    confirmed_weapon_preview_candidates,\n',
              '    battle_weapon_field2_from_icon,\n',
              1,
          )
          old_load = '''        weapon_payload = json.loads(
                      (root / 'references' / 'weapon-appearance-audit' / 'property7_candidates.json').read_text(encoding='utf-8')
                  )
                  weapon_candidates = confirmed_weapon_preview_candidates(weapon_payload)
                  role_manifest = json.loads(
                      (root / 'references' / 'weapon-appearance-audit' / 'role_manifest.json').read_text(encoding='utf-8')
                  )
                  weapon_images = json.loads(
                      (root / 'references' / 'weapon-appearance-audit' / 'weapon_image_ids.json').read_text(encoding='utf-8')
                  )
                  existing_role_dats = {int(role['role_id']) for role in role_manifest['roles']}
                  existing_weapon_images = set(int(image_id) for image_id in weapon_images['image_ids'])
                  low4_values = {int(row['property7_low4_candidate']) for row in weapon_candidates}
          '''
          if old_load not in text:
              raise SystemExit('test_item_registry legacy load block not found')
          text = text.replace(old_load, '', 1)
          text = text.replace('                    weapon_candidates=weapon_candidates,\n', '', 1)
          old_slot = '''            if slot == 10:
                          self.assertEqual(len(slot_items), 130)
                          used_low4 = set()
                          for item in slot_items:
                              self.assertIn('7', item['appearance_properties'])
                              property7 = int(item['appearance_properties']['7'])
                              self.assertIn(property7 % 10000, low4_values)
                              self.assertEqual(property7 // 10000, int(item['icon_code']) // 100)
                              suffix = property7 % 10000
                              role_dat = 100000 + ((suffix // 1000) + 1) * 1000
                              weapon_image = 40000 + suffix
                              self.assertIn(role_dat, existing_role_dats)
                              self.assertIn(weapon_image, existing_weapon_images)
                              used_low4.add(suffix)
                          self.assertTrue(used_low4 <= low4_values)
          '''
          new_slot = '''            if slot == 10:
                          self.assertEqual(len(slot_items), 130)
                          for item in slot_items:
                              self.assertIn('7', item['appearance_properties'])
                              expected_weapon_code = battle_weapon_field2_from_icon(
                                  int(item['icon_code']), int(item['quality'])
                              )
                              self.assertGreater(expected_weapon_code, 0)
                              self.assertEqual(
                                  int(item['appearance_properties']['7']),
                                  expected_weapon_code,
                              )
          '''
          if old_slot not in text:
              raise SystemExit('test_item_registry legacy slot10 block not found')
          text = text.replace(old_slot, new_slot, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused weapon regression
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -p 'test_weapon_appearance_consistency.py' -v

      - name: Run item registry regression
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -p 'test_item_registry.py' -v

      - name: Commit verified fix and remove all temporary workflows
        shell: bash
        run: |
          git config user.name 'M-C-Kai'
          git config user.email '58809786+M-C-Kai@users.noreply.github.com'
          git rm -f \
            .github/workflows/fix-map-weapon-appearance.yml \
            .github/workflows/fix-map-weapon-appearance-v2.yml \
            .github/workflows/fix-map-weapon-appearance-v3.yml
          git add implementation_staging
          git commit -m 'fix: unify equipped weapon appearance on map and battle'
          git push origin master
