name: Apply mount 1024 dispatch

on:
  push:
    branches: [fix/mount-atlas-1024]
    paths:
      - '.github/workflows/apply-mount-1024.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch server dispatch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('implementation_staging/server.py')
          source = path.read_text(encoding='utf-8')

          import_anchor = ")\n\n\nLOG = logging.getLogger('piaomiao-local')"
          import_insert = ")\nfrom mount_protocol import (\n    is_mount_atlas_request,\n    load_mount_atlas_entries,\n    mount_atlas_frame,\n)\n\n\nLOG = logging.getLogger('piaomiao-local')"
          if 'from mount_protocol import (' not in source:
              if import_anchor not in source:
                  raise SystemExit('mount import anchor not found')
              source = source.replace(import_anchor, import_insert, 1)

          dispatch_anchor = "                elif message_id == 1502 and len(values) >= 3:\n"
          dispatch_insert = """                elif message_id == 1024 and values:\n                    if is_mount_atlas_request(fields):\n                        entries = load_mount_atlas_entries()\n                        LOG.info(\n                            'MOUNT_1024 action=30 user=%r role_id=%s atlas_count=%d',\n                            username,\n                            int(active_role['id']) if active_role is not None else None,\n                            len(entries),\n                        )\n                        await self._send(\n                            writer,\n                            mount_atlas_frame(entries),\n                            cipher=game_cipher,\n                            lock=send_lock,\n                        )\n                    else:\n                        LOG.info('ignored mount protocol values=%r', values)\n                elif message_id == 1502 and len(values) >= 3:\n"""
          if 'MOUNT_1024 action=30' not in source:
              if dispatch_anchor not in source:
                  raise SystemExit('mount dispatch anchor not found')
              source = source.replace(dispatch_anchor, dispatch_insert, 1)

          path.write_text(source, encoding='utf-8')
          PY
      - name: Run mount regression tests
        working-directory: implementation_staging
        run: python -m unittest tests.test_mount_catalog
      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation_staging/server.py
          git rm .github/workflows/apply-mount-1024.yml
          git commit -m "fix: handle mount atlas protocol 1024"
          git push origin HEAD:fix/mount-atlas-1024
