name: Apply armor inventory replacement

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/apply_armor_inventory_v2.py'
      - '.github/workflows/apply-armor-inventory-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply armor inventory v2 migration
        run: python .github/scripts/apply_armor_inventory_v2.py

      - name: Regenerate preview catalog
        working-directory: implementation_staging
        env:
          PYTHONPATH: .
        run: python tools/build_equipment_resource_preview_items.py

      - name: Run focused armor regressions
        working-directory: implementation_staging
        run: >-
          python -m unittest
          tests.test_armor_appearance_mapping
          tests.test_armor_inventory_migration
          tests.test_armor_downlink
          tests.test_item_registry
          tests.test_weapon_appearance_consistency
          tests.test_helmet_appearance_mapping

      - name: Verify replacement inventory shape
        working-directory: implementation_staging
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from item_registry import armor_resource_preview_template_mapping, deprecated_armor_template_ids

          preview = json.loads(Path('data/catalog/equipment_resource_preview_items.json').read_text(encoding='utf-8'))
          items = preview['items']
          armor = [item for item in items if int(item.get('equipment_slot', 0)) == 3]
          assert len(items) == 273, len(items)
          assert len(armor) == 31, len(armor)
          assert {int(item['template_id']) for item in armor} == set(armor_resource_preview_template_mapping())
          assert all(set(item.get('appearance_properties', {})) == {'2'} for item in armor)
          assert set(deprecated_armor_template_ids()).isdisjoint({int(item['template_id']) for item in items})
          starter = json.loads(Path('data/catalog/starter_inventory.json').read_text(encoding='utf-8'))
          assert 30_001_001 not in {int(row['template_id']) for row in starter['items']}
          print('armor inventory replacement verified')
          PY

      - name: Commit verified migration and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/apply-armor-inventory-v2.yml
          rm -f .github/scripts/apply_armor_inventory_v2.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name 'M-C-Kai'
          git config user.email '58809786+M-C-Kai@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: replace legacy armor inventory previews'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
