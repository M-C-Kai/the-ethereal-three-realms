name: Migrate weapon appearance mapping to catalog

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/migrate-weapon-appearance-mapping.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Move weapon appearance mapping into catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('implementation_staging')
          catalog_dir = root / 'data' / 'catalog'
          mapping_file = catalog_dir / 'weapon_appearance_mapping.json'

          # One-time migration source: the user-confirmed visual correspondence.
          # Runtime code will not contain these relations; it only reads the JSON below.
          groups = {
              21: (220, 0),
              22: (260, 0),
              23: (271, 1),
              24: (250, 0),
              25: (231, 0),
              26: (280, 0),
              27: (242, 0),
              28: (240, 0),
              29: (241, 0),
              30: (221, 0),
              31: (290, 0),
              32: (270, 0),
              33: (230, 0),
          }
          icon_to_weapon_image = {}
          for icon_group, (family, start_offset) in groups.items():
              for variant in range(10):
                  icon_code = icon_group * 100 + variant
                  weapon_image = family * 100 + variant + start_offset
                  icon_to_weapon_image[str(icon_code)] = weapon_image

          payload = {
              'version': 1,
              'kind': 'weapon_appearance_mapping',
              'status': 'user_confirmed_visual_mapping',
              'source': 'user-provided APK equipment-icon and weapon-resource contact sheets',
              'description': (
                  'Authoritative compatibility-server mapping from equipment icon_code to '
                  'the APK weapon image used by character property 7 and battle 1048 field[2].'
              ),
              'quality_encoding': {
                  'formula': 'weapon_image * 10 + quality',
                  'quality_min': 0,
                  'quality_max': 9,
              },
              'notes': [
                  '2300..2309 map explicitly to 27101..27110.',
                  '2500..2509 map to 23100..23109; APK images 23110/23111 are intentionally unassigned.',
                  'Unknown icon_code values are not guessed and resolve to 0 at runtime.',
              ],
              'icon_to_weapon_image': icon_to_weapon_image,
          }
          mapping_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          path = root / 'item_registry.py'
          text = path.read_text(encoding='utf-8')
          if 'from functools import lru_cache\n' not in text:
              text = text.replace(
                  'from dataclasses import dataclass, field\n',
                  'from dataclasses import dataclass, field\nfrom functools import lru_cache\n',
                  1,
              )

          old = '''# User-confirmed visual mapping between equipment icon groups (21..33) and
          # the APK battle weapon image families.  This is a compatibility mapping
          # derived from the side-by-side resource sheets; it is not claimed to be
          # official server metadata.
          WEAPON_ICON_GROUP_TO_BATTLE_FAMILY = {
              21: 220,
              22: 260,
              23: 271,
              24: 250,
              25: 231,
              26: 280,
              27: 242,
              28: 240,
              29: 241,
              30: 221,
              31: 290,
              32: 270,
              33: 230,
          }


          def battle_weapon_image_from_icon(icon_code: int) -> int:
              """Map one 21xx..33xx weapon icon to its battle image id.

              Each icon group exposes ten variants. Family 271 starts at 27101 rather
              than 27100. Family 231 has two extra APK images (23110/23111) which are
              intentionally not mapped because icon group 25 has only ten entries.
              Unknown groups/variants return zero instead of inventing an appearance.
              """
              code = int(icon_code)
              group = code // 100
              variant = code % 100
              family = WEAPON_ICON_GROUP_TO_BATTLE_FAMILY.get(group)
              if family is None or not 0 <= variant <= 9:
                  return 0
              return (family * 100) + variant + (1 if family == 271 else 0)
          '''
          new = '''WEAPON_APPEARANCE_MAPPING_FILE = (
              Path(__file__).resolve().parent / 'data' / 'catalog' / 'weapon_appearance_mapping.json'
          )


          @lru_cache(maxsize=1)
          def _weapon_icon_to_image_mapping() -> dict[int, int]:
              """Load the weapon appearance relation from the catalog data file."""
              data = json.loads(WEAPON_APPEARANCE_MAPPING_FILE.read_text(encoding='utf-8'))
              if not isinstance(data, dict) or int(data.get('version', 0)) != 1:
                  raise ValueError(
                      f'invalid weapon appearance mapping catalog: {WEAPON_APPEARANCE_MAPPING_FILE}'
                  )
              raw_mapping = data.get('icon_to_weapon_image')
              if not isinstance(raw_mapping, dict) or not raw_mapping:
                  raise ValueError(
                      f'weapon appearance mapping is empty: {WEAPON_APPEARANCE_MAPPING_FILE}'
                  )
              mapping: dict[int, int] = {}
              for raw_icon, raw_image in raw_mapping.items():
                  icon_code = int(raw_icon)
                  weapon_image = int(raw_image)
                  if icon_code <= 0 or weapon_image <= 0:
                      raise ValueError(
                          f'invalid weapon appearance pair {raw_icon!r}->{raw_image!r}'
                      )
                  if icon_code in mapping:
                      raise ValueError(f'duplicate weapon icon_code after normalization: {icon_code}')
                  mapping[icon_code] = weapon_image
              return mapping


          def weapon_icon_to_image_mapping() -> dict[int, int]:
              """Return a copy of the catalog-backed icon_code -> weapon image mapping."""
              return dict(_weapon_icon_to_image_mapping())


          def battle_weapon_image_from_icon(icon_code: int) -> int:
              """Resolve one weapon image from the catalog; unknown icons are not guessed."""
              return _weapon_icon_to_image_mapping().get(int(icon_code), 0)
          '''
          if old not in text:
              raise SystemExit('hard-coded weapon family mapping block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Rewrite catalog-backed weapon mapping regression
        shell: bash
        run: |
          cat > implementation_staging/tests/test_weapon_appearance_consistency.py <<'PY'
          import json
          import sys
          import unittest
          from pathlib import Path

          sys.path.insert(0, str(Path(__file__).resolve().parents[1]))

          import item_registry
          from item_registry import (
              WEAPON_APPEARANCE_MAPPING_FILE,
              battle_weapon_field2_from_icon,
              battle_weapon_image_from_icon,
              default_item_registry,
              weapon_icon_to_image_mapping,
          )
          from protocol import decode_frame, field_values
          from server import Settings, battle_actor_frames, character_appearance, equipped_weapon_battle_field2


          EXPECTED_GROUPS = {
              21: (220, 0), 22: (260, 0), 23: (271, 1), 24: (250, 0),
              25: (231, 0), 26: (280, 0), 27: (242, 0), 28: (240, 0),
              29: (241, 0), 30: (221, 0), 31: (290, 0), 32: (270, 0),
              33: (230, 0),
          }


          def expected_visual_mapping():
              result = {}
              for group, (family, offset) in EXPECTED_GROUPS.items():
                  for variant in range(10):
                      result[group * 100 + variant] = family * 100 + variant + offset
              return result


          class WeaponAppearanceConsistencyTests(unittest.TestCase):
              def test_correspondence_is_stored_in_catalog(self):
                  data = json.loads(WEAPON_APPEARANCE_MAPPING_FILE.read_text(encoding='utf-8'))
                  stored = {int(k): int(v) for k, v in data['icon_to_weapon_image'].items()}
                  self.assertEqual(data['kind'], 'weapon_appearance_mapping')
                  self.assertEqual(data['status'], 'user_confirmed_visual_mapping')
                  self.assertEqual(len(stored), 130)
                  self.assertEqual(stored, expected_visual_mapping())

              def test_runtime_reads_catalog_mapping(self):
                  stored = expected_visual_mapping()
                  self.assertEqual(weapon_icon_to_image_mapping(), stored)
                  self.assertFalse(hasattr(item_registry, 'WEAPON_ICON_GROUP_TO_BATTLE_FAMILY'))
                  for icon_code, weapon_image in stored.items():
                      self.assertEqual(battle_weapon_image_from_icon(icon_code), weapon_image)

              def test_special_rows_are_data_not_code_guesses(self):
                  self.assertEqual(battle_weapon_image_from_icon(2300), 27101)
                  self.assertEqual(battle_weapon_image_from_icon(2309), 27110)
                  self.assertEqual(battle_weapon_image_from_icon(2500), 23100)
                  self.assertEqual(battle_weapon_image_from_icon(2509), 23109)
                  self.assertEqual(battle_weapon_image_from_icon(3400), 0)

              def test_all_130_preview_weapons_use_catalog_mapping(self):
                  root = Path(__file__).resolve().parents[1]
                  preview = json.loads(
                      (root / 'data/catalog/equipment_resource_preview_items.json').read_text(encoding='utf-8')
                  )
                  stored = weapon_icon_to_image_mapping()
                  weapons = [x for x in preview['items'] if int(x.get('equipment_slot', 0)) == 10]
                  self.assertEqual(len(weapons), 130)
                  for item in weapons:
                      icon = int(item['icon_code'])
                      quality = int(item['quality'])
                      code = int(item['appearance_properties']['7'])
                      self.assertEqual(code // 10, stored[icon], icon)
                      self.assertEqual(code, stored[icon] * 10 + quality, icon)
                      self.assertEqual(code, battle_weapon_field2_from_icon(icon, quality), icon)

              def test_starter_map_and_battle_match(self):
                  settings = Settings()
                  role = {'id': 10001, 'name': '测试角色', 'model': 19, 'items': [
                      {'id': 1, 'template_id': 100001001, 'quantity': 1, 'location': 'equipped'}
                  ]}
                  map_code = character_appearance(role, settings.item_registry)[7]
                  self.assertEqual(map_code, 242011)
                  self.assertEqual(equipped_weapon_battle_field2(role, settings.item_registry), map_code)
                  _, fields = decode_frame(battle_actor_frames(role, settings)[0])
                  self.assertEqual(field_values(fields)[2], map_code)

              def test_preview_map_and_battle_match(self):
                  root = Path(__file__).resolve().parents[1]
                  preview = json.loads(
                      (root / 'data/catalog/equipment_resource_preview_items.json').read_text(encoding='utf-8')
                  )
                  item = next(
                      x for x in preview['items']
                      if int(x.get('equipment_slot', 0)) == 10 and int(x['icon_code']) == 3200
                  )
                  registry = default_item_registry()
                  role = {'id': 10001, 'name': '测试角色', 'model': 19, 'items': [
                      {'id': 1, 'template_id': int(item['template_id']), 'quantity': 1, 'location': 'equipped'}
                  ]}
                  map_code = character_appearance(role, registry)[7]
                  self.assertEqual(map_code, 270001)
                  self.assertEqual(equipped_weapon_battle_field2(role, registry), map_code)
                  _, fields = decode_frame(
                      battle_actor_frames(role, Settings(item_registry=registry))[0]
                  )
                  self.assertEqual(field_values(fields)[2], map_code)

              def test_unequipped_is_zero(self):
                  registry = default_item_registry()
                  role = {'id': 10001, 'name': '测试角色', 'model': 19, 'items': []}
                  self.assertEqual(character_appearance(role, registry)[7], 0)
                  self.assertEqual(equipped_weapon_battle_field2(role, registry), 0)


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Verify generated preview catalog uses the data mapping
        working-directory: implementation_staging
        run: PYTHONPATH=. python tools/build_equipment_resource_preview_items.py

      - name: Run weapon appearance regression
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -p 'test_weapon_appearance_consistency.py' -v

      - name: Run item registry regression
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -p 'test_item_registry.py' -v

      - name: Check diff
        run: git diff --check

      - name: Commit verified catalog migration and remove workflow
        shell: bash
        run: |
          git config user.name 'M-C-Kai'
          git config user.email '58809786+M-C-Kai@users.noreply.github.com'
          git rm -f .github/workflows/migrate-weapon-appearance-mapping.yml
          git add implementation_staging
          git commit -m 'refactor: move weapon appearance mapping into catalog'
          git push origin master
