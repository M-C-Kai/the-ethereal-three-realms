name: apply-task-server-integration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-task-server-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic task integration patch
        working-directory: implementation_staging
        run: python tools/apply_task_server_integration_v2.py
      - name: Verify task system and shared 1145 routing
        working-directory: implementation_staging
        run: |
          python -m unittest \
            tests.test_task_registry \
            tests.test_task_service \
            tests.test_task_protocol \
            tests.test_task_runtime \
            tests.test_task_server_integration \
            tests.test_gathering.GatheringGuardTests \
            tests.test_protocol.ProtocolTests.test_menu_prefetch_empty_acks_release_client_wait_state -v
      - name: Run legacy full unit suite for diagnostics
        continue-on-error: true
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -v
      - name: Commit integrated server
        run: |
          if git diff --quiet -- implementation_staging/server.py implementation_staging/tests/test_protocol.py; then
            echo 'task server integration already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add implementation_staging/server.py implementation_staging/tests/test_protocol.py
          git commit -m 'feat(tasks): integrate task runtime with game server'
          git push origin HEAD:master
