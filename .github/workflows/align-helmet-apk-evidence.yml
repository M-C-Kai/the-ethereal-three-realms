name: Align helmet APK evidence

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/align-helmet-apk-evidence.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply APK evidence patch
        run: python .github/scripts/align_helmet_apk_evidence.py

      - name: Regenerate preview catalog
        working-directory: implementation_staging
        env:
          PYTHONPATH: .
        run: python tools/build_equipment_resource_preview_items.py

      - name: Run affected tests
        working-directory: implementation_staging
        run: python -m unittest tests.test_helmet_appearance_mapping tests.test_helmet_apk_resource_evidence tests.test_item_registry

      - name: Commit verified changes
        shell: bash
        run: |
          rm -f .github/workflows/align-helmet-apk-evidence.yml
          rm -f .github/scripts/align_helmet_apk_evidence.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name 'M-C-Kai'
          git config user.email '58809786+M-C-Kai@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: align helmet appearance data with APK evidence'
          git push origin HEAD:master
