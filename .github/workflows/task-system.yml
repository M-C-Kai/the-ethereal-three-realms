name: task-system

on:
  push:
    branches: [master]
    paths:
      - 'implementation_staging/task_*.py'
      - 'implementation_staging/data/catalog/tasks.json'
      - 'implementation_staging/server.py'
      - 'implementation_staging/tests/test_task_*.py'
      - '.github/workflows/task-system.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Task system tests
        working-directory: implementation_staging
        run: python -m unittest discover -s tests -p 'test_task_*.py' -v
