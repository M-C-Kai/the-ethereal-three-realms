name: task-system

on:
  push:
    branches: [feature/task-system]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Task system tests
        working-directory: implementation_staging
        run: |
          python -m unittest tests.test_task_registry tests.test_task_service tests.test_task_protocol tests.test_task_runtime tests.test_task_server_integration -v
