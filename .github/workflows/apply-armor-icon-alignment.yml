name: Apply armor icon alignment

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/apply_armor_icon_alignment.py'
      - '.github/workflows/apply-armor-icon-alignment.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation_staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply armor icon alignment
        working-directory: .
        run: python .github/scripts/apply_armor_icon_alignment.py
      - name: Regenerate preview catalog
        env:
          PYTHONPATH: .
        run: python tools/build_equipment_resource_preview_items.py
      - name: Run focused regressions
        run: python -m unittest tests.test_armor_icon_alignment tests.test_armor_appearance_mapping tests.test_armor_inventory_migration tests.test_inventory_cleanup_v3 tests.test_armor_downlink tests.test_item_registry tests.test_weapon_appearance_consistency tests.test_helmet_appearance_mapping
      - name: Verify armor icon/resource shape
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from item_registry import armor_icon_to_property2_mapping, armor_resource_preview_template_mapping

          expected = {}
          for offset, base in enumerate((300, 1200, 1300)):
              for frame in range(10):
                  expected[base + frame] = offset * 10 + frame + 1
          assert armor_icon_to_property2_mapping() == expected
          assert set(armor_resource_preview_template_mapping().values()) == set(range(1, 31))

          payload = json.loads(Path('data/catalog/equipment_resource_preview_items.json').read_text(encoding='utf-8'))
          armor = [row for row in payload['items'] if int(row['equipment_slot']) == 3]
          assert len(payload['items']) == 250, len(payload['items'])
          assert len(armor) == 30, len(armor)
          assert {int(row['icon_code']): int(row['appearance_properties']['2']) for row in armor} == expected
          assert all(int(row['appearance_properties']['2']) != 0 for row in armor)
          print('armor icon alignment verified')
          PY
      - name: Commit verified alignment and remove temporary files
        working-directory: .
        shell: bash
        run: |
          rm -f .github/workflows/apply-armor-icon-alignment.yml
          rm -f .github/scripts/apply_armor_icon_alignment.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name 'M-C-Kai'
          git config user.email '58809786+M-C-Kai@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: align armor inventory icons with body resources'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
