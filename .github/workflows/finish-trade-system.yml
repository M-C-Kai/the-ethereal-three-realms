name: finish-trade-system

on:
  push:
    branches: [feat/consignment-full-flow-20260912]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Capture unchanged repository baseline
        shell: bash
        run: |
          mv implementation_staging/tests/test_trade_system.py /tmp/test_trade_system.py
          mv implementation_staging/tests/test_trade_order_history.py /tmp/test_trade_order_history.py
          set +e
          (cd implementation_staging && python -m unittest discover -s tests -v) > /tmp/trade-baseline.log 2>&1
          set -e
          grep -E '^(FAIL|ERROR): ' /tmp/trade-baseline.log \
            | sed -E 's/^(FAIL|ERROR): ([^ ]+).*/\1 \2/' \
            | sort -u > /tmp/trade-baseline.names || true
          mv /tmp/test_trade_system.py implementation_staging/tests/test_trade_system.py
          mv /tmp/test_trade_order_history.py implementation_staging/tests/test_trade_order_history.py
          git reset --hard HEAD
          echo "baseline failures: $(wc -l < /tmp/trade-baseline.names)"
          test "$(wc -l < /tmp/trade-baseline.names)" -eq 31
          cat /tmp/trade-baseline.names

      - name: Apply complete trade system
        run: python implementation_staging/tools/apply_trade_system_patch.py

      - name: Verify trade lifecycle and native consignment protocol
        working-directory: implementation_staging
        run: |
          python -m py_compile consignment_service.py consignment_protocol.py server.py
          python -m unittest \
            tests.test_trade_system \
            tests.test_trade_order_history \
            tests.test_consignment_service \
            tests.test_consignment_protocol \
            tests.test_consignment_server_contract \
            tests.test_consignment_category_entry \
            tests.test_consignment_entry \
            tests.test_consignment_categories -v

      - name: Prove no new full-suite regression
        shell: bash
        run: |
          set +e
          (cd implementation_staging && python -m unittest discover -s tests -v) > /tmp/trade-after.log 2>&1
          set -e
          grep -E '^(FAIL|ERROR): ' /tmp/trade-after.log \
            | sed -E 's/^(FAIL|ERROR): ([^ ]+).*/\1 \2/' \
            | sort -u > /tmp/trade-after.names || true
          echo "after failures: $(wc -l < /tmp/trade-after.names)"
          diff -u /tmp/trade-baseline.names /tmp/trade-after.names

      - name: Commit verified trade system and remove temporary machinery
        shell: bash
        run: |
          rm -f implementation_staging/tools/apply_trade_system_patch.py
          rm -f .github/workflows/apply-trade-system.yml
          rm -f .github/workflows/verify-trade-system.yml
          rm -f .github/workflows/resume-trade-system.yml
          rm -f .github/workflows/finish-trade-system.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add implementation_staging/consignment_service.py \
                  implementation_staging/server.py \
                  implementation_staging/data/consignment_listings.json \
                  implementation_staging/TRADE_SYSTEM.md \
                  implementation_staging/tests/test_trade_system.py \
                  implementation_staging/tests/test_trade_order_history.py
          git add -A implementation_staging/tools .github/workflows
          git status --short
          git commit -m "feat: complete durable trading lifecycle [GREEN]"
          git push
