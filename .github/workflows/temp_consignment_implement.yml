name: temp-consignment-implement
on:
  push:
    branches: [ feat/item-consignment-market-integrated ]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write RED consignment tests
        shell: bash
        run: |
          cat > implementation_staging/tests/test_consignment_protocol.py <<'PY'
          from __future__ import annotations
          import unittest
          from consignment_protocol import (
              ConsignmentWireRecord,
              consignment_market_list_frame,
              consignment_my_listings_frame,
              is_consignment_buy_request,
              is_consignment_list_item_request,
              is_consignment_my_listings_request,
              is_consignment_unlist_request,
          )
          from protocol import byte, integer, decode_frame, field_values

          class ConsignmentProtocolTests(unittest.TestCase):
              def test_exact_native_request_shapes(self):
                  self.assertTrue(is_consignment_list_item_request([
                      byte(9), integer(1234), byte(1), integer(10001), byte(2), integer(500),
                  ]))
                  self.assertTrue(is_consignment_my_listings_request([byte(7), integer(10001)]))
                  self.assertTrue(is_consignment_unlist_request([
                      byte(2), integer(1234), byte(1), integer(10001),
                  ]))
                  self.assertTrue(is_consignment_buy_request([
                      byte(4), integer(1234), integer(10002),
                  ]))

              def test_market_record_is_eight_fields_and_own_record_is_seven(self):
                  record = ConsignmentWireRecord(1, 1234, 170901002, 2, 1000, '辟邪', 10001, '卖家')
                  mid, fields = decode_frame(consignment_market_list_frame([record]))
                  self.assertEqual(mid, 1138)
                  values = field_values(fields)
                  self.assertEqual(values[:4], [1, 1, 0, 1])
                  self.assertEqual(values[4:], [1, 1234, 170901002, 2, 1000, '辟邪', 10001, '卖家'])
                  mid, fields = decode_frame(consignment_my_listings_frame([record]))
                  self.assertEqual(mid, 1138)
                  values = field_values(fields)
                  self.assertEqual(values[:2], [7, 1])
                  self.assertEqual(values[2:], [1, 1234, 170901002, 2, 1000, '辟邪', 10001])

          if __name__ == '__main__':
              unittest.main()
          PY

          cat > implementation_staging/tests/test_consignment_service.py <<'PY'
          from __future__ import annotations
          import json
          import tempfile
          import unittest
          from pathlib import Path
          from consignment_service import ConsignmentService, consignment_category_for_item

          class FakeRegistry:
              def resolve(self, item):
                  base = {
                      'name': item.get('name', '物品'),
                      'equipment_slot': item.get('equipment_slot', 0),
                      'icon_code': item.get('icon_code', 0),
                      'kind': item.get('kind', 'item'),
                      'max_quantity': item.get('max_quantity', 99),
                  }
                  return base

          class FakeRoleStore:
              def __init__(self, path, roles):
                  self.path = Path(path)
                  self.data = {'next_role_id': 20000, 'accounts': {'a': roles}}
              def save(self):
                  self.path.write_text(json.dumps(self.data, ensure_ascii=False), encoding='utf-8')

          def role(rid, name, silver=10000, cap=20):
              return {'id': rid, 'name': name, 'items': [], 'bag_capacity': cap,
                      'currencies': {'silver': silver}}

          class ConsignmentServiceTests(unittest.TestCase):
              def setUp(self):
                  self.tmp = tempfile.TemporaryDirectory()
                  root = Path(self.tmp.name)
                  self.seller = role(10001, '卖家')
                  self.buyer = role(10002, '买家')
                  self.store = FakeRoleStore(root/'roles.json', [self.seller, self.buyer])
                  self.market_path = root/'consignment.json'
                  self.registry = FakeRegistry()
                  self.service = ConsignmentService(self.store, self.registry, self.market_path)
              def tearDown(self):
                  self.tmp.cleanup()

              def test_whole_item_is_escrowed_and_restart_persists(self):
                  item = {'id': 501, 'template_id': 1, 'quantity': 1, 'location': 'bag',
                          'equipment_slot': 1, 'name': '头盔'}
                  self.seller['items'].append(item)
                  result = self.service.list_item(self.seller, 501, 1, 500)
                  self.assertTrue(result.ok)
                  self.assertEqual(item['location'], 'consignment')
                  self.assertEqual(self.service.search(14)[0]['item_instance_id'], 501)
                  again = ConsignmentService(self.store, self.registry, self.market_path)
                  self.assertEqual(again.my_listings(10001)[0]['item_instance_id'], 501)

              def test_partial_stack_allocates_unique_escrow_instance(self):
                  item = {'id': 600, 'template_id': 2, 'quantity': 10, 'location': 'bag',
                          'kind': '材料', 'name': '玄铁'}
                  self.seller['items'].append(item)
                  result = self.service.list_item(self.seller, 600, 3, 25)
                  self.assertTrue(result.ok)
                  self.assertEqual(item['quantity'], 7)
                  self.assertNotEqual(result.item['id'], 600)
                  self.assertEqual(result.item['quantity'], 3)
                  self.assertEqual(result.item['location'], 'consignment')
                  self.assertIn(result.item, self.seller['items'])

              def test_unlist_restores_same_instance_and_full_bag_rejects(self):
                  item = {'id': 700, 'template_id': 3, 'quantity': 1, 'location': 'bag', 'name':'道具'}
                  self.seller['items'].append(item)
                  listed = self.service.list_item(self.seller, 700, 1, 100)
                  self.seller['bag_capacity'] = 0
                  failed = self.service.unlist(self.seller, listed.listing['item_instance_id'])
                  self.assertFalse(failed.ok)
                  self.assertEqual(item['location'], 'consignment')
                  self.seller['bag_capacity'] = 20
                  ok = self.service.unlist(self.seller, listed.listing['item_instance_id'])
                  self.assertTrue(ok.ok)
                  self.assertIs(ok.item, item)
                  self.assertEqual(item['location'], 'bag')

              def test_buy_moves_same_instance_and_silver_once(self):
                  item = {'id': 800, 'template_id': 4, 'quantity': 2, 'location': 'bag',
                          'kind':'材料', 'name':'仙石碎片'}
                  self.seller['items'].append(item)
                  listed = self.service.list_item(self.seller, 800, 2, 300)
                  bought = self.service.buy(self.buyer, listed.listing['item_instance_id'])
                  self.assertTrue(bought.ok)
                  self.assertIs(bought.item, item)
                  self.assertNotIn(item, self.seller['items'])
                  self.assertIn(item, self.buyer['items'])
                  self.assertEqual(item['location'], 'bag')
                  self.assertEqual(self.buyer['currencies']['silver'], 9400)
                  self.assertEqual(self.seller['currencies']['silver'], 10600)
                  again = self.service.buy(self.buyer, 800)
                  self.assertFalse(again.ok)
                  self.assertEqual(self.buyer['currencies']['silver'], 9400)

              def test_buy_rejects_self_insufficient_silver_and_full_bag(self):
                  item = {'id': 900, 'template_id': 5, 'quantity': 1, 'location':'bag', 'name':'道具'}
                  self.seller['items'].append(item)
                  listed = self.service.list_item(self.seller, 900, 1, 20000)
                  self.assertFalse(self.service.buy(self.seller, 900).ok)
                  self.assertFalse(self.service.buy(self.buyer, 900).ok)
                  self.buyer['currencies']['silver'] = 30000
                  self.buyer['bag_capacity'] = 0
                  self.assertFalse(self.service.buy(self.buyer, 900).ok)
                  self.assertEqual(item['location'], 'consignment')

              def test_category_mapping_covers_weapon_mount_material_and_generic(self):
                  self.assertEqual(consignment_category_for_item(
                      {'equipment_slot':10,'icon_code':2100}, self.registry), 1)
                  self.assertEqual(consignment_category_for_item(
                      {'equipment_slot':17}, self.registry), 24)
                  self.assertEqual(consignment_category_for_item(
                      {'kind':'材料'}, self.registry), 27)
                  self.assertEqual(consignment_category_for_item({}, self.registry), 26)

          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Verify RED
        working-directory: implementation_staging
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_consignment_protocol tests.test_consignment_service > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected RED failure before implementation, but tests passed.'
            exit 1
          fi
          echo 'RED confirmed: new contract is not implemented yet.'

      - name: Implement protocol and service
        shell: bash
        run: |
          cat > implementation_staging/consignment_protocol.py <<'PY'
          """APK-native protocol 1138 helpers for the item consignment market."""
          from __future__ import annotations
          from dataclasses import dataclass
          from typing import Iterable, Mapping
          from protocol import TYPE_BYTE, TYPE_INT, Field, byte, encode_frame, integer, short, string

          CONSIGNMENT_MESSAGE_ID = 1138
          CONSIGNMENT_SCREEN_ID = 613
          CONSIGNMENT_OPEN_ACTION = 69
          CONSIGNMENT_ACTION_MARKET_LIST = 1
          CONSIGNMENT_ACTION_UNLIST = 2
          CONSIGNMENT_ACTION_REFRESH_MERCHANT = 3
          CONSIGNMENT_ACTION_BUY = 4
          CONSIGNMENT_ACTION_MY_LISTINGS = 7
          CONSIGNMENT_ACTION_LIST = 9
          CONSIGNMENT_ACTION_BROWSE = 13
          CONSIGNMENT_ACTION_REMOVE_OWN = 15
          CONSIGNMENT_ACTION_REMOVE_MARKET = 16
          CONSIGNMENT_MARKET_REQUEST_ACTIONS = frozenset({0, 23})
          CONSIGNMENT_OBJECT_ITEM = 1
          CONSIGNMENT_OBJECT_PET = 3

          CONSIGNMENT_ITEM_CATEGORIES = (
              '所有武器', '长枪', '折扇', '环器', '棍杖', '双刃', '爪刺', '剑', '刀', '笔',
              '长斧', '灯枪', '半月', '双斧', '头盔', '肩甲', '铠甲', '腰带', '腿甲', '项链',
              '披风', '护腕', '鞋子', '戒指', '坐骑', '外套', '道具', '材料',
          )

          @dataclass(frozen=True)
          class ConsignmentWireRecord:
              object_type: int
              item_instance_id: int
              template_id: int
              quantity: int
              price: int
              display_name: str
              seller_role_id: int
              seller_name: str = ''

              def own_fields(self) -> list[Field]:
                  return [
                      byte(self.object_type), integer(self.item_instance_id), integer(self.template_id),
                      integer(self.quantity), integer(self.price), string(self.display_name),
                      integer(self.seller_role_id),
                  ]

              def market_fields(self) -> list[Field]:
                  return [*self.own_fields(), string(self.seller_name)]

          def wire_record_from_listing(listing: Mapping[str, object]) -> ConsignmentWireRecord:
              return ConsignmentWireRecord(
                  object_type=CONSIGNMENT_OBJECT_ITEM,
                  item_instance_id=int(listing['item_instance_id']),
                  template_id=int(listing['template_id']),
                  quantity=int(listing['quantity']),
                  price=int(listing['unit_price']) * int(listing['quantity']),
                  display_name=str(listing.get('display_name', '')),
                  seller_role_id=int(listing['seller_role_id']),
                  seller_name=str(listing.get('seller_name', '')),
              )

          def _exact(fields: list[Field], types: tuple[int, ...], action: int) -> bool:
              return len(fields) == len(types) and all(f.type_id == t for f, t in zip(fields, types)) and int(fields[0].value) == action

          def is_consignment_category_request(fields: list[Field]) -> bool:
              return _exact(fields, (TYPE_BYTE,), CONSIGNMENT_ACTION_REFRESH_MERCHANT)

          def is_consignment_browse_request(fields: list[Field]) -> bool:
              return bool(_exact(fields, (TYPE_BYTE, TYPE_BYTE), CONSIGNMENT_ACTION_BROWSE)
                          and 0 <= int(fields[1].value) < len(CONSIGNMENT_ITEM_CATEGORIES))

          def is_consignment_my_listings_request(fields: list[Field]) -> bool:
              return _exact(fields, (TYPE_BYTE, TYPE_INT), CONSIGNMENT_ACTION_MY_LISTINGS)

          def is_consignment_list_item_request(fields: list[Field]) -> bool:
              return bool(_exact(fields, (TYPE_BYTE, TYPE_INT, TYPE_BYTE, TYPE_INT, TYPE_BYTE, TYPE_INT), CONSIGNMENT_ACTION_LIST)
                          and int(fields[4].value) > 0 and int(fields[5].value) > 0)

          def is_consignment_unlist_request(fields: list[Field]) -> bool:
              return _exact(fields, (TYPE_BYTE, TYPE_INT, TYPE_BYTE, TYPE_INT), CONSIGNMENT_ACTION_UNLIST)

          def is_consignment_buy_request(fields: list[Field]) -> bool:
              return _exact(fields, (TYPE_BYTE, TYPE_INT, TYPE_INT), CONSIGNMENT_ACTION_BUY)

          def is_consignment_market_list_request(fields: list[Field]) -> bool:
              return bool(fields and fields[0].type_id == TYPE_BYTE and int(fields[0].value) in CONSIGNMENT_MARKET_REQUEST_ACTIONS)

          def consignment_category_frame() -> bytes:
              fields: list[Field] = [byte(CONSIGNMENT_ACTION_REFRESH_MERCHANT), byte(len(CONSIGNMENT_ITEM_CATEGORIES))]
              for category_id, name in enumerate(CONSIGNMENT_ITEM_CATEGORIES):
                  fields.extend((byte(category_id), string(name)))
              return encode_frame(CONSIGNMENT_MESSAGE_ID, fields)

          def consignment_category_counts_frame(counts: Iterable[int]) -> bytes:
              values = [max(0, int(v)) for v in counts]
              return encode_frame(CONSIGNMENT_MESSAGE_ID, [byte(CONSIGNMENT_ACTION_BROWSE), byte(len(values)), *(integer(v) for v in values)])

          def consignment_market_list_frame(records: Iterable[ConsignmentWireRecord]) -> bytes:
              rows = list(records)
              fields: list[Field] = [byte(CONSIGNMENT_ACTION_MARKET_LIST), integer(len(rows)), integer(0), integer(len(rows))]
              for row in rows:
                  fields.extend(row.market_fields())
              return encode_frame(CONSIGNMENT_MESSAGE_ID, fields)

          def consignment_my_listings_frame(records: Iterable[ConsignmentWireRecord], *, action: int = CONSIGNMENT_ACTION_MY_LISTINGS) -> bytes:
              rows = list(records)
              fields: list[Field] = [byte(action), byte(len(rows))]
              for row in rows:
                  fields.extend(row.own_fields())
              return encode_frame(CONSIGNMENT_MESSAGE_ID, fields)

          def consignment_remove_owned_frame(item_instance_id: int) -> bytes:
              return encode_frame(CONSIGNMENT_MESSAGE_ID, [byte(CONSIGNMENT_ACTION_REMOVE_OWN), integer(item_instance_id)])

          def consignment_remove_market_frame(item_instance_id: int) -> bytes:
              return encode_frame(CONSIGNMENT_MESSAGE_ID, [byte(CONSIGNMENT_ACTION_REMOVE_MARKET), integer(item_instance_id)])

          def consignment_screen_frame(*, mode: int = 0) -> bytes:
              return encode_frame(1010, [integer(0), short(0), short(0), integer(mode), integer(CONSIGNMENT_SCREEN_ID), short(CONSIGNMENT_OPEN_ACTION)])

          def empty_consignment_result_frame(action: int) -> bytes:
              return encode_frame(CONSIGNMENT_MESSAGE_ID, [byte(action), byte(0)])
          PY

          cat > implementation_staging/consignment_service.py <<'PY'
          """Persistent real-item escrow and transactions for protocol 1138."""
          from __future__ import annotations
          import copy
          import json
          import time
          from dataclasses import dataclass
          from pathlib import Path
          from typing import Any, Mapping

          CONSIGNMENT_LOCATION = 'consignment'
          ACTIVE = 'active'
          VALID_STATUSES = {'active', 'sold', 'cancelled', 'expired'}
          DEFAULT_BAG_CAPACITY = 1000
          MAX_SILVER = 2_147_483_647

          EQUIPMENT_SLOT_TO_CATEGORY = {
              1: 14, 2: 15, 3: 16, 4: 17, 5: 18, 6: 19, 7: 20,
              8: 21, 9: 22, 11: 23, 17: 24,
          }

          @dataclass
          class ConsignmentResult:
              ok: bool
              reason: str = ''
              listing: dict[str, object] | None = None
              item: dict[str, object] | None = None
              source_item: dict[str, object] | None = None
              removed_from_bag: bool = False
              total_price: int = 0

          def _role_items(role: Mapping[str, object]) -> list[dict[str, object]]:
              items = role.get('items', [])
              return items if isinstance(items, list) else []  # type: ignore[return-value]

          def _bag_count(role: Mapping[str, object]) -> int:
              return sum(str(item.get('location', 'bag')) == 'bag' for item in _role_items(role))

          def _bag_capacity(role: Mapping[str, object]) -> int:
              try:
                  return max(0, int(role.get('bag_capacity', DEFAULT_BAG_CAPACITY)))
              except (TypeError, ValueError):
                  return DEFAULT_BAG_CAPACITY

          def _silver(role: Mapping[str, object]) -> int:
              currencies = role.get('currencies', {})
              if not isinstance(currencies, dict):
                  return 0
              try:
                  return max(0, int(currencies.get('silver', 0)))
              except (TypeError, ValueError):
                  return 0

          def _set_silver(role: dict[str, object], value: int) -> None:
              currencies = role.get('currencies')
              if not isinstance(currencies, dict):
                  currencies = {}
                  role['currencies'] = currencies
              currencies['silver'] = max(0, min(MAX_SILVER, int(value)))

          def consignment_category_for_item(item: Mapping[str, object], registry: Any) -> int:
              resolved = registry.resolve(dict(item))
              slot = int(resolved.get('equipment_slot', item.get('equipment_slot', 0)) or 0)
              if slot == 10:
                  icon = int(resolved.get('icon_code', item.get('icon_code', 0)) or 0)
                  group = (icon // 100) % 100
                  if 21 <= group <= 33:
                      return group - 20
                  return 0
              if slot in EQUIPMENT_SLOT_TO_CATEGORY:
                  return EQUIPMENT_SLOT_TO_CATEGORY[slot]
              text = f"{resolved.get('kind', item.get('kind', ''))} {resolved.get('name', item.get('name', ''))}".lower()
              if '外套' in text or 'outerwear' in text:
                  return 25
              if any(token in text for token in ('材料', 'material', '矿石', '碎片', '药材')):
                  return 27
              return 26

          class ConsignmentService:
              def __init__(self, role_store: Any, item_registry: Any, data_file: str | Path | None = None):
                  self.role_store = role_store
                  self.item_registry = item_registry
                  if data_file is None:
                      data_file = Path(__file__).resolve().parent / 'data' / 'consignment_listings.json'
                  self.path = Path(data_file)
                  self.data: dict[str, object] = {'next_listing_id': 1, 'next_item_instance_id': 1, 'listings': []}
                  self._reload()

              def _reload(self) -> None:
                  if not self.path.exists():
                      return
                  try:
                      loaded = json.loads(self.path.read_text(encoding='utf-8'))
                  except (OSError, ValueError):
                      return
                  if isinstance(loaded, dict) and isinstance(loaded.get('listings'), list):
                      self.data = loaded

              def _save(self) -> None:
                  self.path.parent.mkdir(parents=True, exist_ok=True)
                  tmp = self.path.with_suffix(self.path.suffix + '.tmp')
                  tmp.write_text(json.dumps(self.data, ensure_ascii=False, indent=2), encoding='utf-8')
                  tmp.replace(self.path)

              def _persist(self, role_snapshots: list[tuple[dict[str, object], dict[str, object]]], data_snapshot: dict[str, object]) -> None:
                  try:
                      self.role_store.save()
                      self._save()
                  except Exception:
                      for role, snapshot in role_snapshots:
                          role.clear(); role.update(copy.deepcopy(snapshot))
                      self.data = copy.deepcopy(data_snapshot)
                      try:
                          self.role_store.save(); self._save()
                      except Exception:
                          pass
                      raise

              def _listings(self) -> list[dict[str, object]]:
                  rows = self.data.setdefault('listings', [])
                  if not isinstance(rows, list):
                      rows = []; self.data['listings'] = rows
                  return rows  # type: ignore[return-value]

              def _all_roles(self):
                  accounts = self.role_store.data.get('accounts', {})
                  if not isinstance(accounts, dict):
                      return
                  for roles in accounts.values():
                      if isinstance(roles, list):
                          for role in roles:
                              if isinstance(role, dict):
                                  yield role

              def find_role(self, role_id: int) -> dict[str, object] | None:
                  return next((r for r in self._all_roles() if int(r.get('id', 0)) == int(role_id)), None)

              def _find_item(self, role: Mapping[str, object], item_id: int) -> dict[str, object] | None:
                  return next((i for i in _role_items(role) if int(i.get('id', 0)) == int(item_id)), None)

              def _listing(self, item_instance_id: int) -> dict[str, object] | None:
                  return next((row for row in self._listings()
                               if int(row.get('item_instance_id', 0)) == int(item_instance_id)
                               and row.get('status') == ACTIVE), None)

              def _next_item_id(self) -> int:
                  used = {int(i.get('id', 0)) for role in self._all_roles() for i in _role_items(role) if int(i.get('id', 0)) > 0}
                  floor = max(used, default=0) + 1
                  candidate = max(floor, int(self.data.get('next_item_instance_id', 1)))
                  while candidate in used:
                      candidate += 1
                  self.data['next_item_instance_id'] = candidate + 1
                  return candidate

              def _next_listing_id(self) -> int:
                  value = max(1, int(self.data.get('next_listing_id', 1)))
                  self.data['next_listing_id'] = value + 1
                  return value

              def _tradable(self, item: Mapping[str, object]) -> bool:
                  if str(item.get('location', 'bag')) != 'bag':
                      return False
                  if any(bool(item.get(key, False)) for key in ('bound', 'is_bound', 'binding')):
                      return False
                  resolved = self.item_registry.resolve(dict(item))
                  if resolved.get('tradable') is False or resolved.get('can_trade') is False:
                      return False
                  kind = str(resolved.get('kind', '')).lower()
                  if '任务' in kind or kind == 'task':
                      return False
                  return True

              def list_item(self, seller: dict[str, object], instance_id: int, quantity: int, unit_price: int) -> ConsignmentResult:
                  self._reload()
                  item = self._find_item(seller, instance_id)
                  if item is None or not self._tradable(item):
                      return ConsignmentResult(False, 'item_not_tradable')
                  owned = int(item.get('quantity', 1))
                  quantity = int(quantity); unit_price = int(unit_price)
                  if quantity <= 0 or quantity > owned:
                      return ConsignmentResult(False, 'invalid_quantity')
                  if unit_price <= 0 or unit_price > MAX_SILVER:
                      return ConsignmentResult(False, 'invalid_price')
                  category = consignment_category_for_item(item, self.item_registry)
                  resolved = self.item_registry.resolve(item)
                  seller_snapshot = copy.deepcopy(seller); data_snapshot = copy.deepcopy(self.data)
                  removed = quantity == owned
                  if removed:
                      escrow_item = item
                      escrow_item['location'] = CONSIGNMENT_LOCATION
                  else:
                      item['quantity'] = owned - quantity
                      escrow_item = copy.deepcopy(item)
                      escrow_item['id'] = self._next_item_id()
                      escrow_item['quantity'] = quantity
                      escrow_item['location'] = CONSIGNMENT_LOCATION
                      _role_items(seller).append(escrow_item)
                  listing = {
                      'listing_id': self._next_listing_id(),
                      'seller_role_id': int(seller.get('id', 0)),
                      'seller_name': str(seller.get('name', '')),
                      'item_instance_id': int(escrow_item['id']),
                      'template_id': int(escrow_item.get('template_id', 0)),
                      'quantity': int(escrow_item.get('quantity', 1)),
                      'unit_price': unit_price,
                      'category_id': category,
                      'display_name': str(resolved.get('name', escrow_item.get('name', ''))),
                      'status': ACTIVE,
                      'created_at': int(time.time()),
                      'expires_at': 0,
                      'buyer_role_id': None,
                      'sold_at': None,
                  }
                  self._listings().append(listing)
                  self._persist([(seller, seller_snapshot)], data_snapshot)
                  return ConsignmentResult(True, listing=listing, item=escrow_item,
                                           source_item=None if removed else item,
                                           removed_from_bag=removed,
                                           total_price=unit_price * quantity)

              def search(self, category_id: int) -> list[dict[str, object]]:
                  self._reload(); category_id = int(category_id)
                  rows = [row for row in self._listings() if row.get('status') == ACTIVE]
                  if category_id == 0:
                      rows = [row for row in rows if 0 <= int(row.get('category_id', -1)) <= 13]
                  else:
                      rows = [row for row in rows if int(row.get('category_id', -1)) == category_id]
                  return sorted(rows, key=lambda row: int(row.get('listing_id', 0)))

              def my_listings(self, role_id: int) -> list[dict[str, object]]:
                  self._reload()
                  return [row for row in self._listings()
                          if row.get('status') == ACTIVE and int(row.get('seller_role_id', 0)) == int(role_id)]

              def category_count(self, category_id: int) -> int:
                  return len(self.search(category_id))

              def unlist(self, seller: dict[str, object], item_instance_id: int) -> ConsignmentResult:
                  self._reload(); listing = self._listing(item_instance_id)
                  if listing is None or int(listing.get('seller_role_id', 0)) != int(seller.get('id', 0)):
                      return ConsignmentResult(False, 'listing_not_found')
                  item = self._find_item(seller, item_instance_id)
                  if item is None or item.get('location') != CONSIGNMENT_LOCATION:
                      return ConsignmentResult(False, 'escrow_item_missing')
                  if _bag_count(seller) >= _bag_capacity(seller):
                      return ConsignmentResult(False, 'bag_full')
                  seller_snapshot = copy.deepcopy(seller); data_snapshot = copy.deepcopy(self.data)
                  item['location'] = 'bag'; listing['status'] = 'cancelled'
                  self._persist([(seller, seller_snapshot)], data_snapshot)
                  return ConsignmentResult(True, listing=listing, item=item)

              def buy(self, buyer: dict[str, object], item_instance_id: int) -> ConsignmentResult:
                  self._reload(); listing = self._listing(item_instance_id)
                  if listing is None:
                      return ConsignmentResult(False, 'listing_not_found')
                  seller = self.find_role(int(listing.get('seller_role_id', 0)))
                  if seller is None:
                      return ConsignmentResult(False, 'seller_not_found')
                  if int(seller.get('id', 0)) == int(buyer.get('id', 0)):
                      return ConsignmentResult(False, 'self_purchase')
                  item = self._find_item(seller, item_instance_id)
                  if item is None or item.get('location') != CONSIGNMENT_LOCATION:
                      return ConsignmentResult(False, 'escrow_item_missing')
                  total = int(listing.get('unit_price', 0)) * int(listing.get('quantity', 1))
                  if total <= 0 or _silver(buyer) < total:
                      return ConsignmentResult(False, 'insufficient_silver')
                  if _bag_count(buyer) >= _bag_capacity(buyer):
                      return ConsignmentResult(False, 'bag_full')
                  if _silver(seller) + total > MAX_SILVER:
                      return ConsignmentResult(False, 'seller_silver_overflow')
                  buyer_snapshot = copy.deepcopy(buyer); seller_snapshot = copy.deepcopy(seller); data_snapshot = copy.deepcopy(self.data)
                  _set_silver(buyer, _silver(buyer) - total); _set_silver(seller, _silver(seller) + total)
                  _role_items(seller).remove(item); item['location'] = 'bag'; _role_items(buyer).append(item)
                  listing['status'] = 'sold'; listing['buyer_role_id'] = int(buyer.get('id', 0)); listing['sold_at'] = int(time.time())
                  self._persist([(buyer, buyer_snapshot), (seller, seller_snapshot)], data_snapshot)
                  return ConsignmentResult(True, listing=listing, item=item, total_price=total)
          PY

          mkdir -p implementation_staging/data
          if [ ! -f implementation_staging/data/consignment_listings.json ]; then
            cat > implementation_staging/data/consignment_listings.json <<'JSON'
          {
            "next_listing_id": 1,
            "next_item_instance_id": 1,
            "listings": []
          }
          JSON
          fi

      - name: Patch server integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('implementation_staging/server.py')
          text = p.read_text(encoding='utf-8')

          old_import = '''from consignment_protocol import (\n    CONSIGNMENT_ACTION_BROWSE,\n    CONSIGNMENT_ITEM_CATEGORIES,\n    consignment_category_frame,\n    empty_consignment_result_frame,\n    is_consignment_browse_request,\n    is_consignment_category_request,\n)\n'''
          new_import = '''from consignment_protocol import (\n    CONSIGNMENT_ACTION_LIST,\n    CONSIGNMENT_ITEM_CATEGORIES,\n    CONSIGNMENT_OBJECT_ITEM,\n    CONSIGNMENT_OBJECT_PET,\n    consignment_category_counts_frame,\n    consignment_category_frame,\n    consignment_market_list_frame,\n    consignment_my_listings_frame,\n    consignment_remove_market_frame,\n    consignment_remove_owned_frame,\n    is_consignment_browse_request,\n    is_consignment_buy_request,\n    is_consignment_category_request,\n    is_consignment_list_item_request,\n    is_consignment_market_list_request,\n    is_consignment_my_listings_request,\n    is_consignment_unlist_request,\n    wire_record_from_listing,\n)\nfrom consignment_service import ConsignmentService\n'''
          if old_import not in text:
              raise SystemExit('consignment import marker changed')
          text = text.replace(old_import, new_import, 1)

          old_entry = '        *(item_frame(item) for item in role_items(role)),\n'
          new_entry = "        *(item_frame(item) for item in role_items(role) if item.get('location', 'bag') != 'consignment'),\n"
          if old_entry not in text:
              raise SystemExit('role_entry item marker changed')
          text = text.replace(old_entry, new_entry, 1)

          state_marker = '        current_shop_category = 0\n'
          state_insert = '''        current_shop_category = 0\n        # Native 1138 market state is connection-local; durable listings live in\n        # ConsignmentService/consignment_listings.json. The service reloads the\n        # listing file before each operation so separate client connections see\n        # each other's completed transactions without sharing mutable caches.\n        current_consignment_category = 0\n        consignment = ConsignmentService(self.roles, self.settings.item_registry)\n'''
          if state_marker not in text:
              raise SystemExit('connection state marker changed')
          text = text.replace(state_marker, state_insert, 1)

          pattern = re.compile(r"                elif message_id == 1138 and fields:\n.*?\n                elif message_id == 1143 and active_role is not None and fields:\n", re.S)
          replacement = '''                elif message_id == 1138 and fields:\n                    role_id = int(active_role.get('id', 0)) if active_role is not None else 0\n                    if is_consignment_category_request(fields):\n                        LOG.info('CONSIGNMENT_CATEGORIES user=%r role_id=%d count=%d', username, role_id, len(CONSIGNMENT_ITEM_CATEGORIES))\n                        await self._send(writer, consignment_category_frame(), cipher=game_cipher, lock=send_lock)\n\n                    elif is_consignment_browse_request(fields):\n                        current_consignment_category = int(fields[1].value)\n                        total = consignment.category_count(current_consignment_category)\n                        LOG.info('CONSIGNMENT_BROWSE user=%r role_id=%d category_id=%d category=%r active=%d', username, role_id, current_consignment_category, CONSIGNMENT_ITEM_CATEGORIES[current_consignment_category], total)\n                        # APK screen 44 consumes action-13 as a count/filter vector.\n                        # Actual item rows are requested afterwards (action 0/23)\n                        # and arrive as native action-1 eight-field records.\n                        await self._send(writer, consignment_category_counts_frame([total]), cipher=game_cipher, lock=send_lock)\n\n                    elif is_consignment_market_list_request(fields):\n                        rows = consignment.search(current_consignment_category)\n                        records = [wire_record_from_listing(row) for row in rows]\n                        LOG.info('CONSIGNMENT_MARKET_LIST user=%r role_id=%d category=%d count=%d request_action=%d', username, role_id, current_consignment_category, len(records), int(fields[0].value))\n                        await self._send(writer, consignment_market_list_frame(records), cipher=game_cipher, lock=send_lock)\n\n                    elif is_consignment_my_listings_request(fields):\n                        requested_role = int(fields[1].value)\n                        if active_role is None or requested_role != role_id:\n                            LOG.warning('CONSIGNMENT_MY_REJECT user=%r role_id=%d requested=%d', username, role_id, requested_role)\n                        else:\n                            rows = consignment.my_listings(role_id)\n                            await self._send(writer, consignment_my_listings_frame([wire_record_from_listing(row) for row in rows]), cipher=game_cipher, lock=send_lock)\n\n                    elif is_consignment_list_item_request(fields):\n                        item_id = int(fields[1].value); object_type = int(fields[2].value); requested_role = int(fields[3].value)\n                        quantity = int(fields[4].value); unit_price = int(fields[5].value)\n                        if active_role is None or requested_role != role_id:\n                            await self._send(writer, top_message_frame('寄售角色信息已失效'), cipher=game_cipher, lock=send_lock)\n                        elif object_type == CONSIGNMENT_OBJECT_PET:\n                            await self._send(writer, top_message_frame('宠物寄售暂未开放'), cipher=game_cipher, lock=send_lock)\n                        elif object_type != CONSIGNMENT_OBJECT_ITEM:\n                            await self._send(writer, top_message_frame('该对象暂不支持寄售'), cipher=game_cipher, lock=send_lock)\n                        else:\n                            result = consignment.list_item(active_role, item_id, quantity, unit_price)\n                            if not result.ok:\n                                LOG.info('CONSIGNMENT_LIST_REJECT user=%r role_id=%d item_id=%d reason=%s', username, role_id, item_id, result.reason)\n                                await self._send(writer, top_message_frame('寄售失败：' + result.reason), cipher=game_cipher, lock=send_lock)\n                            else:\n                                updates = []\n                                if result.removed_from_bag:\n                                    # Existing bag discard path confirms 1009/short(3)/item-id\n                                    # is the APK-native removal notification.\n                                    updates.append(encode_frame(1009, [short(3), integer(item_id)]))\n                                elif result.source_item is not None:\n                                    updates.append(item_frame(result.source_item, self.settings.item_registry, operation=3))\n                                own = consignment.my_listings(role_id)\n                                updates.append(consignment_my_listings_frame([wire_record_from_listing(row) for row in own], action=CONSIGNMENT_ACTION_LIST))\n                                LOG.info('CONSIGNMENT_LIST_SUCCESS user=%r role_id=%d item_id=%d quantity=%d unit_price=%d', username, role_id, int(result.listing['item_instance_id']), quantity, unit_price)\n                                await self._send(writer, *updates, cipher=game_cipher, lock=send_lock)\n\n                    elif is_consignment_unlist_request(fields):\n                        item_id = int(fields[1].value); object_type = int(fields[2].value); requested_role = int(fields[3].value)\n                        if active_role is None or requested_role != role_id or object_type != CONSIGNMENT_OBJECT_ITEM:\n                            await self._send(writer, top_message_frame('下架请求无效'), cipher=game_cipher, lock=send_lock)\n                        else:\n                            result = consignment.unlist(active_role, item_id)\n                            if not result.ok:\n                                await self._send(writer, top_message_frame('下架失败：' + result.reason), cipher=game_cipher, lock=send_lock)\n                            else:\n                                await self._send(writer, consignment_remove_owned_frame(item_id), item_frame(result.item, self.settings.item_registry, operation=3), cipher=game_cipher, lock=send_lock)\n\n                    elif is_consignment_buy_request(fields):\n                        item_id = int(fields[1].value); requested_buyer = int(fields[2].value)\n                        if active_role is None or requested_buyer != role_id:\n                            await self._send(writer, top_message_frame('购买请求无效'), cipher=game_cipher, lock=send_lock)\n                        else:\n                            result = consignment.buy(active_role, item_id)\n                            if not result.ok:\n                                await self._send(writer, top_message_frame('购买失败：' + result.reason), cipher=game_cipher, lock=send_lock)\n                            else:\n                                silver = int(active_role.get('currencies', {}).get('silver', 0))\n                                await self._send(\n                                    writer,\n                                    consignment_remove_market_frame(item_id),\n                                    item_frame(result.item, self.settings.item_registry, operation=3),\n                                    character_appearance_frame(role_id, {50: silver}),\n                                    cipher=game_cipher, lock=send_lock,\n                                )\n                                LOG.info('CONSIGNMENT_BUY_SUCCESS user=%r buyer_role_id=%d item_id=%d total=%d silver=%d', username, role_id, item_id, result.total_price, silver)\n                    else:\n                        LOG.info('ignored consignment message=1138 values=%r', values)\n\n                elif message_id == 1143 and active_role is not None and fields:\n'''
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'1138 handler marker changed count={count}')
          p.write_text(text2, encoding='utf-8')
          PY

